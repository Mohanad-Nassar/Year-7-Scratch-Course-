<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fruit Catch Scratch Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Scratch-workspace dotted ground; a left "stack" of lesson blocks that snap together; each lesson runs Starter → I do → We do → You do → Exit ticket. */
:root{
  --bg:#f3f5fb; --dot:#d9deec; --panel:#ffffff; --panel2:#eef1f9; --ink:#1f2340; --ink2:#575d80; --line:#d8dcec;
  --accent:#855cd6; --accent-ink:#ffffff; --focus:#ff8c1a;
  --motion:#4c97ff; --looks:#9966ff; --sound:#cf63cf; --events:#ffbf00; --control:#ffab19; --sensing:#5cb1d6; --operators:#59c059; --variables:#ff8c1a; --myblocks:#ff6680;
  --good:#1f9d55; --good-bg:#e3f6ea; --bad:#d64545; --bad-bg:#fde8e8; --warn-bg:#fff4d6;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:0 1px 0 rgba(31,35,64,.06),0 6px 18px -10px rgba(31,35,64,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141626; --dot:#262a42; --panel:#1d2036; --panel2:#252946; --ink:#eceefb; --ink2:#a9aed0; --line:#323757;
  --accent:#a88bff; --accent-ink:#141626; --good:#5fd38d; --good-bg:#183a2a; --bad:#ff8a8a; --bad-bg:#3d1f26; --warn-bg:#3a3220; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141626; --dot:#262a42; --panel:#1d2036; --panel2:#252946; --ink:#eceefb; --ink2:#a9aed0; --line:#323757;
  --accent:#a88bff; --accent-ink:#141626; --good:#5fd38d; --good-bg:#183a2a; --bad:#ff8a8a; --bad-bg:#3d1f26; --warn-bg:#3a3220; color-scheme:dark;}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px;object-fit:contain}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:.72rem;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.topbar .spacer{flex:1}
.pill-btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill-btn:hover{border-color:var(--accent)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 60px}}

/* lesson stack nav = Scratch stack blocks */
.stack{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column}
.stack .cap{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px 4px;font-weight:600}
.sblock{--c:var(--motion);position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--c);color:#fff;font-family:var(--font-display);font-weight:600;font-size:1rem;padding:12px 14px 14px 14px;margin-top:-4px;border-radius:8px;filter:saturate(.9);opacity:.92;transition:transform .15s ease,opacity .15s,filter .15s;text-decoration:none}
.sblock:first-of-type{margin-top:0;border-top-left-radius:22px;border-top-right-radius:22px;padding-top:18px}
.sblock::before{content:"";position:absolute;left:18px;top:-1px;width:26px;height:7px;background:var(--bg);border-radius:0 0 7px 7px}
.sblock:first-of-type::before{display:none}
.sblock::after{content:"";position:absolute;left:18px;bottom:-6px;width:26px;height:7px;background:var(--c);border-radius:0 0 7px 7px;z-index:1}
.sblock .num{display:grid;place-items:center;min-width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.25);font-size:.9rem}
.sblock .t{line-height:1.15}
.sblock .t small{display:block;font-family:var(--font-body);font-weight:500;font-size:.72rem;opacity:.92}
.sblock .tick{margin-left:auto;font-size:.8rem;background:rgba(255,255,255,.28);border-radius:999px;padding:1px 8px;font-family:var(--font-body)}
.sblock:hover{opacity:1;transform:translateX(3px)}
.sblock[aria-current="page"]{opacity:1;filter:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.65);transform:translateX(6px)}
.sblock.dark-text{color:#3b2a00}
.sblock.dark-text .num{background:rgba(0,0,0,.12)}
@media (max-width:900px){
  .stack{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:thin}
  .stack .cap{display:none}
  .sblock,.sblock:first-of-type{margin:0;border-radius:12px;padding:8px 12px;white-space:nowrap;flex:0 0 auto}
  .sblock::before,.sblock::after{display:none}
  .sblock[aria-current="page"]{transform:none}
  .sblock .t small{display:none}
}

/* ---------- views ---------- */
main{min-width:0}
.view{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
@media (max-width:600px){.panel{padding:16px}}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.lede{color:var(--ink2);max-width:65ch}

/* lesson hero */
.lhero{--c:var(--motion);position:relative;border-radius:22px;overflow:hidden;background:var(--c);color:#fff;padding:26px 26px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.lhero.dark-text{color:#2f2200}
.lhero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700}
.lhero .bq{font-size:1.08rem;opacity:.95;margin-top:6px;max-width:52ch}
.lhero .lnum{font-family:var(--font-display);font-weight:700;font-size:.95rem;opacity:.9;letter-spacing:.04em}
.lhero .art{width:150px;height:110px;position:relative}
.lhero .art img{position:absolute;object-fit:contain}
@media (max-width:600px){.lhero{grid-template-columns:1fr;padding:20px}.lhero .art{display:none}}

/* phase rail */
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phase-link{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.phase-link .dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--ink2))}
.phase-link:hover{border-color:var(--pc)}

.sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:1.5rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--pc);color:#fff}
.tag.dark-text{color:#2f2200}
.mins{font-size:.82rem;color:var(--ink2);margin-left:auto}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.objectives{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.objectives li{display:flex;gap:10px;align-items:flex-start}
.objectives li::before{content:"";flex:0 0 16px;height:10px;margin-top:8px;border-radius:3px 3px 3px 3px;background:var(--accent);box-shadow:4px 3px 0 -1px var(--panel2)}

/* vocab flip cards */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vcard{perspective:700px;border:0;background:none;padding:0;height:118px;text-align:left}
.vcard .in{position:relative;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.vcard[aria-pressed="true"] .in{transform:rotateY(180deg)}
.vcard .f,.vcard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:center}
.vcard .f{background:var(--panel2);border:2px solid var(--line);font-family:var(--font-display);font-size:1.15rem;font-weight:600;color:var(--ink)}
.vcard .f small{font-family:var(--font-body);font-size:.72rem;color:var(--ink2);font-weight:500;margin-top:4px}
.vcard .b{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg);font-size:.86rem;line-height:1.35}

/* media */
.vid{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9;display:block}
.shot{border-radius:10px;border:1px solid var(--line);width:100%;height:auto;display:block;cursor:zoom-in}
figure{margin:0}
figcaption{font-size:.82rem;color:var(--ink2);margin-top:6px}

/* scratchblocks */
.sb-wrap{overflow-x:auto;padding:4px 2px}
.sb-wrap svg{max-width:none}
pre.blocks{margin:0;white-space:pre;font-family:var(--font-mono);font-size:.8rem;color:var(--ink2)}
.code-card{background:var(--panel2);border-radius:12px;padding:14px;border:1px solid var(--line);min-width:0}
.code-card h4{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.code-card h4 img{width:26px;height:26px;object-fit:contain}

/* build animation */
.builder{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.builder{grid-template-columns:minmax(0,1fr)}}
.builder .canvas{background:var(--panel2);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;border-radius:12px;border:1px solid var(--line);min-height:250px;padding:16px;overflow-x:auto;position:relative}
.builder .canvas .snap{animation:snap .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes snap{0%{transform:translate(-14px,-10px) scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.builder .say{font-size:1rem}
.builder .added{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;font-size:.88rem;padding:6px 12px;border-radius:999px;color:#fff}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.92rem;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.flag{background:var(--operators);color:#fff}
.btn.stop{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;flex:1;min-width:80px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);transition:border-color .2s,background .2s}
.step.done{border-color:var(--good);background:var(--good-bg)}
.step .chk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--ink2);font-size:1.05rem}
.step.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.step h4{font-size:1.05rem;margin-bottom:4px}
.step .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.step .body .shot{max-width:640px}
.kbd{font-family:var(--font-mono);font-size:.82em;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.blk{display:inline-block;font-size:.84em;font-weight:600;color:#fff;border-radius:6px;padding:1px 7px;background:var(--bc,var(--motion))}
.blk.y{color:#3b2a00}

/* challenges */
.chal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.chal{grid-template-columns:minmax(0,1fr)}}
.ch{border-radius:14px;border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--panel);min-width:0}
.ch .medal{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.ch .medal i{width:26px;height:26px;border-radius:50%;display:inline-block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ch.bronze .medal i{background:#c98a52}.ch.silver .medal i{background:#aab4c3}.ch.gold .medal i{background:#f2c230}
details{border-radius:10px;background:var(--panel2);padding:8px 12px}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
details[open] summary{margin-bottom:8px}
.ch label.done{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:500;margin-top:auto}

/* quizzes */
.quiz{display:flex;flex-direction:column;gap:16px}
.q{border-radius:12px;border:1.5px solid var(--line);padding:14px;background:var(--panel)}
.q p.qt{font-weight:600;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:.9rem;padding:8px 10px;border-radius:8px}
.fb.ok{background:var(--good-bg);color:var(--ink)}
.fb.no{background:var(--bad-bg);color:var(--ink)}
.score{font-family:var(--font-display);font-weight:600;font-size:1.1rem}

/* stage sims */
.stagebox{position:relative;width:100%;max-width:480px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#9ff;touch-action:none}
.stagebox canvas{width:100%;height:100%;display:block}
.stagebar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.touchpad{display:flex;gap:8px;margin-top:8px}
.touchpad button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);font-size:1.2rem;color:var(--ink)}
.readout{font-family:var(--font-mono);font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap}
.bool{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;font-family:var(--font-mono);font-size:.85rem;border:2px solid var(--line);background:var(--panel2);transition:all .2s}
.bool.true{background:var(--good-bg);border-color:var(--good)}
.bool b{min-width:44px;text-align:right}

/* parsons */
.parsons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.parsons{grid-template-columns:minmax(0,1fr)}}
.pz{min-height:180px;border-radius:12px;border:2px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2);min-width:0}
.pz h5{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.pitem{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:2px;border-radius:8px;text-align:left;overflow-x:auto}
.pitem:hover{background:rgba(133,92,214,.12)}
.pitem .mv{margin-left:auto;display:flex;gap:4px}
.pitem .mv button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:28px;height:28px;color:var(--ink)}

/* trace table */
.trace{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.trace th,.trace td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-size:.9rem}
.trace th{background:var(--panel2);font-family:var(--font-display);font-weight:600}
.trace td.ev{text-align:left}
.trace input{width:64px;text-align:center;font:inherit;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:3px}
.trace input.ok{border-color:var(--good);background:var(--good-bg)}
.trace input.no{border-color:var(--bad);background:var(--bad-bg)}
.tablewrap{overflow-x:auto}

/* hotspots */
.hot{position:relative}
.hot img{display:block;width:100%;border-radius:10px;border:1px solid var(--line)}
.hot .zone{position:absolute;border:0;background:transparent;border-radius:10px}
.hot .zone.show{outline:4px solid var(--good);background:rgba(31,157,85,.15)}
.hot .zone.miss{outline:4px solid var(--bad);background:rgba(214,69,69,.15)}
.hot-prompt{font-family:var(--font-display);font-size:1.2rem;font-weight:600;margin-bottom:10px}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:26px;align-items:center}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flow div{border-radius:12px;padding:12px;background:var(--panel2);border-top:5px solid var(--pc)}
.flow b{font-family:var(--font-display);font-size:1.05rem;display:block}
.flow span{font-size:.82rem;color:var(--ink2)}
.lcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.lcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lcards{grid-template-columns:minmax(0,1fr)}}
.lcard{--c:var(--motion);text-decoration:none;color:var(--ink);border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.lcard:hover{transform:translateY(-3px)}
.lcard .top{background:var(--c);color:#fff;padding:12px 14px;font-family:var(--font-display);font-weight:600;font-size:1.1rem}
.lcard.dark-text .top{color:#2f2200}
.lcard .bd{padding:12px 14px;font-size:.9rem;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.lcard .concept{font-size:.78rem;font-weight:600;color:var(--ink)}

table.plain{width:100%;border-collapse:collapse;font-size:.92rem}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.plain th{font-family:var(--font-display);font-weight:600;background:var(--panel2)}

.note{border-radius:12px;padding:12px 14px;background:var(--warn-bg);font-size:.92rem}

<script>
// ---------- Course content ----------
const PROJECT_URL = 'https://scratch.mit.edu/projects/1439568018/';
const CAT = {motion:'var(--motion)',looks:'var(--looks)',sound:'var(--sound)',events:'var(--events)',control:'var(--control)',sensing:'var(--sensing)',operators:'var(--operators)',variables:'var(--variables)'};
const PHASES = [
  {id:'starter', name:'Starter', c:'var(--sensing)', mins:'5 min'},
  {id:'ido', name:'I do', c:'var(--motion)', mins:'10 min'},
  {id:'wedo', name:'We do', c:'var(--operators)', mins:'15 min'},
  {id:'activity', name:'Try it', c:'var(--looks)', mins:'10 min'},
  {id:'youdo', name:'You do', c:'var(--control)', mins:'15 min'},
  {id:'exit', name:'Exit ticket', c:'var(--myblocks)', mins:'5 min'}
];

const LESSONS = [
/* ================= LESSON 1 ================= */
{
  n:1, id:'lesson-1', title:'Meet Scratch', concept:'Sequence & coordinates', c:'var(--motion)', dark:false,
  bq:'How do we give a computer step-by-step instructions?',
  art:['cat1','apple'],
  objectives:[
    'Name the four main areas of the Scratch editor.',
    'Add a sprite and a backdrop from the library.',
    'Use x and y coordinates to place a sprite on the stage.',
    'Build a script that runs when the green flag is clicked.'
  ],
  vocab:[['Sprite','A character or object in your project, such as the cat or the apple.'],['Stage','The 480 × 360 area where your project runs.'],['Script','A stack of blocks snapped together. It runs from top to bottom.'],['Algorithm','A set of step-by-step instructions to solve a problem.'],['Coordinates','Two numbers (x, y) that give a position. The centre is (0, 0).'],['Sequence','Instructions that run one after another, in order.']],
  starter:[
    {q:'What is an algorithm?', o:['A type of computer','A set of step-by-step instructions','A picture on the screen','A website'], a:1, why:'An algorithm is a precise set of steps. A recipe is an algorithm for cooking.'},
    {q:'Why does the ORDER of instructions matter?', o:['It does not matter','Computers do exactly what we say, in the order we say it','Computers pick the best order themselves','Only the first instruction runs'], a:1, why:'Computers follow instructions exactly and in sequence. Wrong order, wrong result.'},
    {q:'Which of these is an INPUT device?', o:['Monitor','Speaker','Keyboard','Printer'], a:2, why:'Keyboards send information INTO the computer. We will use the arrow keys as input in Lesson 2.'}
  ],
  ido:{ video:'media/ido-L1.mp4', poster:'media/01-interface.jpg',
    notice:['The block palette is sorted by colour: blue Motion, purple Looks, yellow Events.','Blocks only run when they are snapped under a hat block like "when green flag clicked".','y: -120 puts the cat near the bottom because negative y means down.'],
    build:{ sprite:'cat1', name:'Cat (Sprite1)', lines:[
      ['when green flag clicked','events','A hat block starts the script when the green flag is clicked.'],
      ['go to x: (0) y: (-120)','motion','Move to the middle (x: 0), near the bottom (y: -120).'],
      ['say [Catch the apples!] for (2) seconds','looks','Show a speech bubble for 2 seconds.']
    ]}
  },
  wedo:{ intro:'Follow each step with your teacher. Tick it off when it works on your screen.', steps:[
    {h:'Open Scratch and start a project', html:'Go to <b>scratch.mit.edu</b>, sign in, then click <b>Create</b>. You will see the editor below.', img:'01-interface.jpg'},
    {h:'Name your project', html:'Click the title box at the top and type <b>Fruit Catch – your name</b>. Press <span class="kbd">Enter</span>.'},
    {h:'Add the Apple sprite', html:'Hover over the cat button in the bottom-right corner, then click the magnifying glass (<b>Choose a Sprite</b>).', img:'02-choose-sprite-menu.jpg'},
    {h:'Search for the apple', html:'Type <b>Apple</b> in the search box and click it.', img:'03-search-apple.jpg'},
    {h:'Choose a backdrop', html:'Click <b>Choose a Backdrop</b> (far bottom-right) and pick <b>Blue Sky</b>.', img:'06-backdrop-library.jpg'},
    {h:'Build the cat’s first script', html:'Click <b>Sprite1</b> (the cat) in the sprite pane. Then drag in these three blocks and snap them together:', code:'when green flag clicked\ngo to x: (0) y: (-120)\nsay [Catch the apples!] for (2) seconds', img:'10-L1-code-run.jpg'},
    {h:'Test and save', html:'Click the green flag. The cat should jump to the bottom and talk. Then click <b>File → Save now</b>.'}
  ]},
  activities:[
    {type:'hotspot', title:'Label the editor', intro:'Click the right part of the screenshot for each prompt.'},
    {type:'coords', title:'Coordinate explorer', intro:'Drag the cat around the stage. Watch x and y change. Then try the missions.'}
  ],
  youdo:[
    {lvl:'bronze', t:'Say more', task:'Make the cat say two different things, one after the other.', hint:'Add a second <b>say [ ] for (2) seconds</b> block under the first one.', sol:'when green flag clicked\ngo to x: (0) y: (-120)\nsay [Catch the apples!] for (2) seconds\nsay [Use the arrow keys!] for (2) seconds'},
    {lvl:'silver', t:'Apple at the top', task:'Give the Apple its own script so it always starts at the top-middle of the stage.', hint:'Click the Apple sprite first. The top of the stage is around y: 150.', sol:'when green flag clicked\ngo to x: (0) y: (150)'},
    {lvl:'gold', t:'Slide on stage', task:'Make the cat start off the left side and glide into the middle.', hint:'Use <b>go to x: (-200) y: (-120)</b>, then a <b>glide</b> block from Motion.', sol:'when green flag clicked\ngo to x: (-200) y: (-120)\nglide (1) secs to x: (0) y: (-120)\nsay [Catch the apples!] for (2) seconds'}
  ],
  exit:[
    {q:'What are the coordinates of the centre of the stage?', o:['(240, 180)','(0, 0)','(100, 100)','(-240, -180)'], a:1, why:'The centre is x: 0, y: 0. The stage runs from -240 to 240 across and -180 to 180 up and down.'},
    {q:'Which block makes a script start when the green flag is clicked?', o:['go to x: y:','say for 2 seconds','when green flag clicked','next costume'], a:2, why:'Yellow Events hat blocks start scripts.'},
    {q:'The cat is at y: -120. Where is it?', o:['Near the top','Near the bottom','Far left','Far right'], a:1, why:'Negative y values are below the centre, so -120 is near the bottom.'}
  ],
  sim:1
},
/* ================= LESSON 2 ================= */
{
  n:2, id:'lesson-2', title:'Move the cat', concept:'Events & input', c:'var(--events)', dark:true,
  bq:'How can a program respond to the player?',
  art:['cat2'],
  objectives:[
    'Explain what an event is.',
    'Use "when key pressed" blocks to control a sprite.',
    'Use direction and rotation style so the cat faces the way it moves.',
    'Animate a sprite by changing its costume.'
  ],
  vocab:[['Event','Something that happens, like a key press or a click, that starts a script.'],['Input','Data that goes into the computer, such as pressing a key.'],['Output','What the computer does in response, like moving the cat.'],['x position','How far left or right a sprite is. Bigger x = further right.'],['Direction','Which way a sprite faces. 90 is right, -90 is left.'],['Costume','One of a sprite’s pictures. Switching costumes makes animation.']],
  starter:[
    {q:'A sprite is at x: 0. You run "change x by 50". Where is it now?', o:['x: -50','x: 50','x: 0','y: 50'], a:1, why:'Change x by 50 adds 50, so 0 + 50 = 50 (moves right).'},
    {q:'Which way does y increase?', o:['Left','Right','Up','Down'], a:2, why:'Bigger y means higher up the stage.'},
    {q:'What does a "hat" block do?', o:['Ends a script','Starts a script when something happens','Changes a sprite’s hat','Deletes blocks'], a:1, why:'Hat blocks have a rounded top. Nothing can go above them, so they start scripts.'}
  ],
  ido:{ video:'media/ido-L2.mp4', poster:'media/20-L2-code.jpg',
    notice:['Each arrow key has its own script. The scripts are events that wait for input.','"point in direction" makes the cat face the way it moves.','"next costume" swaps between two pictures so the cat looks like it is walking.'],
    build:{ sprite:'cat2', name:'Cat (Sprite1)', lines:[
      ['when [right arrow v] key pressed','events','This event fires every time the right arrow is pressed.'],
      ['point in direction (90)','motion','Face right. 90 degrees points to the right.'],
      ['change x by (15)','motion','Move 15 steps to the right.'],
      ['next costume','looks','Swap picture so the cat looks like it is walking.']
    ]}
  },
  wedo:{ intro:'We will add two new scripts to the cat and improve the flag script.', steps:[
    {h:'Select the cat', html:'Click <b>Sprite1</b> in the sprite pane so you are editing the cat’s code.'},
    {h:'Stop the cat going upside down', html:'Under <b>when green flag clicked</b>, add <b>set rotation style [left-right]</b> and <b>point in direction (90)</b> from Motion.', code:'when green flag clicked\nset rotation style [left-right v]\npoint in direction (90)\ngo to x: (0) y: (-120)\nsay [Catch the apples!] for (2) seconds'},
    {h:'Add a key event', html:'From <b>Events</b>, drag out <b>when [space] key pressed</b>. Click the drop-down and choose <b>right arrow</b>.'},
    {h:'Move right', html:'Snap these under it: <b>point in direction (90)</b>, <b>change x by (15)</b> and <b>next costume</b> (Looks).', code:'when [right arrow v] key pressed\npoint in direction (90)\nchange x by (15)\nnext costume'},
    {h:'Duplicate for left', html:'Right-click the hat block and choose <b>Duplicate</b>. Change it to <b>left arrow</b>, direction <b>-90</b> and x by <b>-15</b>.', code:'when [left arrow v] key pressed\npoint in direction (-90)\nchange x by (-15)\nnext costume', img:'20-L2-code.jpg'},
    {h:'Test', html:'Click the green flag, then press <span class="kbd">←</span> and <span class="kbd">→</span>. The cat should walk both ways and always stay the right way up. Save your work.'}
  ]},
  activities:[
    {type:'parsons', title:'Build the left-arrow script', intro:'Tap blocks to add them in the right order. One block is a trap and is not needed.',
      answer:['when [left arrow v] key pressed','point in direction (-90)','change x by (-15)','next costume'],
      distract:['change y by (-15)']},
    {type:'predict', title:'Predict it', items:[
      {q:'You delete "set rotation style [left-right]". What happens when you press the left arrow?', o:['Nothing changes','The cat turns upside down','The cat moves up','The cat disappears'], a:1, why:'Without left-right rotation style, pointing in direction -90 flips the cat over, so it walks upside down.'},
      {q:'You change "change x by (15)" to "change x by (40)". What happens?', o:['The cat moves faster (bigger jumps)','The cat moves slower','The cat moves up','Nothing'], a:0, why:'Each key press now moves 40 steps instead of 15.'}
    ]}
  ],
  youdo:[
    {lvl:'bronze', t:'Speed up', task:'Make the cat move faster in both directions.', hint:'Change both <b>change x by</b> numbers. Keep the left one negative.', sol:'when [right arrow v] key pressed\npoint in direction (90)\nchange x by (25)\nnext costume'},
    {lvl:'silver', t:'Jump!', task:'When the space bar is pressed, make the cat jump up and come back down.', hint:'Use <b>change y by (60)</b>, then <b>wait</b>, then <b>change y by (-60)</b>.', sol:'when [space v] key pressed\nchange y by (60)\nwait (0.3) seconds\nchange y by (-60)'},
    {lvl:'gold', t:'Click to talk', task:'When the player clicks the cat, it should say a random tip about the game.', hint:'Use <b>when this sprite clicked</b>. For a bonus, use <b>pick random</b> with <b>if</b> blocks to choose between tips.', sol:'when this sprite clicked\nsay [Watch out for falling fruit!] for (2) seconds'}
  ],
  exit:[
    {q:'What is an event?', o:['A block that repeats code','Something that happens, like a key press, that starts a script','A type of variable','A sprite’s picture'], a:1, why:'Events, like a key press or a click, trigger scripts to run.'},
    {q:'Which direction makes the cat face LEFT?', o:['90','0','-90','180'], a:2, why:'90 is right, -90 is left, 0 is up and 180 is down.'},
    {q:'Pressing the arrow key is an example of…', o:['Output','Input','Storage','Processing'], a:1, why:'A key press is input. The cat moving is the output.'}
  ],
  sim:2
},
/* ================= LESSON 3 ================= */
{
  n:3, id:'lesson-3', title:'Make it rain apples', concept:'Iteration (loops)', c:'var(--control)', dark:true,
  bq:'How do loops stop us repeating ourselves?',
  art:['apple','apple'],
  objectives:[
    'Explain what iteration means.',
    'Use a count-controlled loop (repeat) and an infinite loop (forever).',
    'Use pick random to make a game less predictable.',
    'Work out how far a sprite moves inside a loop.'
  ],
  vocab:[['Iteration','Repeating a set of instructions. Another word for looping.'],['Repeat','A loop that runs a set number of times. Count-controlled.'],['Forever','A loop that never stops (until the program stops).'],['Random','Unpredictable. "pick random" chooses a different number each time.'],['Nesting','Putting one block inside another, like a repeat inside a forever.'],['Efficient','Doing a job with less code. Loops make code efficient.']],
  starter:[
    {q:'Which block makes the cat face left?', o:['point in direction (90)','point in direction (-90)','change x by (-15)','next costume'], a:1, why:'Direction -90 faces left.'},
    {q:'Why do we use "set rotation style [left-right]"?', o:['To make the cat faster','To stop the cat turning upside down','To change costume','To start the game'], a:1, why:'Left-right style only lets the sprite flip, never rotate upside down.'},
    {q:'How many times would you need to write "change y by (-5)" to move 325 steps down?', o:['5','65','325','100'], a:1, why:'325 ÷ 5 = 65. Writing it 65 times would be a lot of blocks. A loop does it with one!'}
  ],
  ido:{ video:'media/ido-L3.mp4', poster:'media/30-L3-code.jpg',
    notice:['The repeat loop is nested inside the forever loop.','pick random gives a new x position each time, so you never know where the apple will fall.','65 repeats × 5 steps = 325 steps. From y: 170 that ends at y: -155, just above the ground.'],
    build:{ sprite:'apple', name:'Apple', lines:[
      ['when green flag clicked','events','Start when the flag is clicked.'],
      ['forever','control','Everything inside will repeat until the game stops.'],
      ['go to x: (pick random (-200) to (200)) y: (170)','motion','Jump to a random spot along the top of the stage.'],
      ['repeat (65)','control','A count-controlled loop: run the code inside 65 times.'],
      ['change y by (-5)','motion','Move down 5 steps each time round the loop.'],
      ['end','control',''],
      ['end','control','']
    ]}
  },
  wedo:{ intro:'Today the Apple gets its own script.', steps:[
    {h:'Select the Apple', html:'Click the <b>Apple</b> sprite. Its code area should be empty (unless you did the Lesson 1 silver challenge, which you can delete).'},
    {h:'Add a forever loop', html:'Drag in <b>when green flag clicked</b>, then a <b>forever</b> block from <b>Control</b>.'},
    {h:'Start at a random place', html:'Inside forever, add <b>go to x: () y: ()</b>. Drop a green <b>pick random (-200) to (200)</b> block into the x slot. Set y to <b>170</b>.'},
    {h:'Fall with a repeat loop', html:'Under the go to block, add <b>repeat (65)</b> with <b>change y by (-5)</b> inside it.', code:'when green flag clicked\nforever\n  go to x: (pick random (-200) to (200)) y: (170)\n  repeat (65)\n    change y by (-5)\n  end\nend', img:'30-L3-code.jpg'},
    {h:'Test', html:'Click the flag. The apple should fall, then start again from a new place at the top. Save.'}
  ]},
  activities:[
    {type:'looplab', title:'Loop lab', intro:'Change the loop. Can you make the apple stop exactly on the grass line at y: -150?'},
    {type:'predict', title:'Repeat or forever?', items:[
      {q:'You want the cat to spin round exactly once (36 turns of 10°). Which loop?', o:['repeat (36)','forever'], a:0, why:'You know how many times, so a count-controlled repeat loop is right.'},
      {q:'You want background music to play for the whole game. Which loop?', o:['repeat (10)','forever'], a:1, why:'The music never needs to stop during the game, so use forever.'},
      {q:'What happens if you swap "repeat (65)" for "forever" inside the apple script?', o:['Nothing changes','The apple falls off the bottom and never comes back','The apple falls faster','The apple goes up'], a:1, why:'An inner forever never ends, so the code after it never runs again and the apple keeps going down.'}
    ]}
  ],
  youdo:[
    {lvl:'bronze', t:'Faster fruit', task:'Make the apple fall twice as fast but still stop near the ground.', hint:'Double the step and halve the repeats: 10 steps × 32 repeats ≈ 320.', sol:'when green flag clicked\nforever\n  go to x: (pick random (-200) to (200)) y: (170)\n  repeat (32)\n    change y by (-10)\n  end\nend'},
    {lvl:'silver', t:'Spinning apple', task:'Make the apple spin as it falls.', hint:'Add a <b>turn ↻ (5) degrees</b> block inside the repeat loop.', sol:'when green flag clicked\nforever\n  go to x: (pick random (-200) to (200)) y: (170)\n  repeat (65)\n    change y by (-5)\n    turn @turnRight (5) degrees\n  end\nend'},
    {lvl:'gold', t:'A second fruit', task:'Add a Strawberry that also falls from a random place.', hint:'Add the Strawberry sprite, then drag the Apple’s script onto the Strawberry in the sprite pane to copy it.', sol:'when green flag clicked\nforever\n  go to x: (pick random (-200) to (200)) y: (170)\n  repeat (40)\n    change y by (-8)\n  end\nend'}
  ],
  exit:[
    {q:'What is iteration?', o:['Making a choice','Repeating instructions','Storing a number','Drawing a sprite'], a:1, why:'Iteration means looping: repeating instructions.'},
    {q:'An apple starts at y: 170 and runs "repeat (10): change y by (-10)". Where does it end?', o:['y: 160','y: 70','y: 100','y: -10'], a:1, why:'10 × -10 = -100, and 170 - 100 = 70.'},
    {q:'Which is a count-controlled loop?', o:['forever','repeat (10)','when flag clicked','if then'], a:1, why:'repeat (10) runs a set number of times.'}
  ],
  sim:3
},
/* ================= LESSON 4 ================= */
{
  n:4, id:'lesson-4', title:'Catch & score', concept:'Selection & variables', c:'var(--sensing)', dark:false,
  bq:'How does a game make decisions?',
  art:['cat1','apple'],
  objectives:[
    'Explain what selection (if…then) does.',
    'Use a sensing condition: touching another sprite.',
    'Create a variable and change it while the game runs.',
    'Use a comparison (y position < -160) as a condition.'
  ],
  vocab:[['Selection','Choosing what to do based on a condition. In Scratch: if … then.'],['Condition','A question with a true or false answer, like "touching cat?"'],['Boolean','A value that is only ever true or false. Hexagon-shaped blocks.'],['Variable','A named store for data that can change, like score.'],['Initialise','Give a variable its starting value, such as set score to 0.'],['Comparison','Checking two values with <, > or =.']],
  starter:[
    {q:'Which loop runs forever?', o:['repeat (10)','forever','if then','wait (1)'], a:1, why:'forever is an infinite loop.'},
    {q:'"repeat (4): change y by (-20)". How far does the sprite move?', o:['20 down','80 down','80 up','4 down'], a:1, why:'4 × -20 = -80, so 80 steps down.'},
    {q:'What does pick random (1) to (6) do?', o:['Always gives 6','Gives a number from 1 to 6, like a dice','Gives 1 then 6','Picks a sprite'], a:1, why:'It picks a different number between 1 and 6 each time.'}
  ],
  ido:{ video:'media/ido-L4.mp4', poster:'media/40-L4-code.jpg',
    notice:['The repeat loop is gone. Now the apple moves a little bit each time round forever, and checks two questions every time.','Conditions are hexagons. They fit in the hexagon gap in an if block.','After scoring, the apple must jump back to the top or it would keep scoring while it touches the cat.'],
    build:{ sprite:'apple', name:'Apple', lines:[
      ['when green flag clicked','events','Start the apple’s script.'],
      ['go to x: (pick random (-200) to (200)) y: (170)','motion','Start at a random place at the top.'],
      ['forever','control','Keep running these checks all game.'],
      ['change y by (-5)','motion','Fall a little bit.'],
      ['if <touching (Sprite1 v)?> then','control','Question 1: is the apple touching the cat?'],
      ['change [score v] by (1)','variables','Yes! Add 1 to the score.'],
      ['start sound (Chomp v)','sound','Play a crunch sound as feedback.'],
      ['go to x: (pick random (-200) to (200)) y: (170)','motion','Go back to the top for the next catch.'],
      ['end','control',''],
      ['if <(y position) < [-160]> then','control','Question 2: has the apple reached the ground?'],
      ['go to x: (pick random (-200) to (200)) y: (170)','motion','Missed it. Back to the top.'],
      ['end','control',''],
      ['end','control','']
    ]}
  },
  wedo:{ intro:'We will make a score variable, then rebuild the apple script with two if blocks.', steps:[
    {h:'Make a variable', html:'Go to <b>Variables</b> and click <b>Make a Variable</b>. Name it <b>score</b> and keep <b>For all sprites</b> selected. Click OK.', img:'41-make-variable.jpg'},
    {h:'Initialise the score', html:'Click the cat. At the top of its flag script (just under the hat block) add <b>set [score] to (0)</b>.', code:'when green flag clicked\nset [score v] to [0]\nset rotation style [left-right v]\npoint in direction (90)\ngo to x: (0) y: (-120)\nsay [Catch the apples!] for (2) seconds'},
    {h:'Rebuild the apple loop', html:'Click the Apple. Drag the <b>repeat</b> loop out and delete it. Move <b>go to x: (pick random…) y: (170)</b> above forever. Put <b>change y by (-5)</b> inside forever.'},
    {h:'Add the catch check', html:'From Control add <b>if &lt; &gt; then</b>. From Sensing drop <b>touching (Sprite1)?</b> into the hexagon gap. Inside: <b>change score by 1</b>, <b>start sound (Chomp)</b>, and go back to the top.'},
    {h:'Add the ground check', html:'Add a second <b>if</b>. From Operators use <b>( ) &lt; ( )</b>. Put <b>y position</b> (Motion) on the left and type <b>-160</b> on the right. Inside: go back to the top.', code:'when green flag clicked\ngo to x: (pick random (-200) to (200)) y: (170)\nforever\n  change y by (-5)\n  if <touching (Sprite1 v)?> then\n    change [score v] by (1)\n    start sound (Chomp v)\n    go to x: (pick random (-200) to (200)) y: (170)\n  end\n  if <(y position) < [-160]> then\n    go to x: (pick random (-200) to (200)) y: (170)\n  end\nend', img:'40-L4-code.jpg'},
    {h:'Test', html:'Play! The score in the top-left of the stage should go up by exactly 1 each catch. Save.'}

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, html) => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'style') e.style.cssText = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if (html != null) e.innerHTML = html; return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('fc:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fc:' + k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function blocksSVG(code, scale = 0.68) {
  const host = el('div', { class: 'sb-wrap' });
  try {
    if (!window.scratchblocks) throw 0;
    const doc = scratchblocks.parse(code, { languages: ['en'] });
    const svg = scratchblocks.render(doc, { style: 'scratch3', scale });
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Scratch blocks: ' + code.replace(/\n/g, '; '));
    host.appendChild(svg);
  } catch (e) {
    host.appendChild(el('pre', { class: 'blocks' }, code.replace(/</g, '&lt;')));
  }
  return host;
}
function catColor(c) { return CAT[c] || 'var(--motion)'; }

const IMG = {};
['cat1', 'cat2', 'apple', 'bananas'].forEach(n => { IMG[n] = new Image(); IMG[n].src = 'media/' + n + '.png'; });
IMG.sky = new Image(); IMG.sky.src = 'media/bluesky.jpg';
const SIZE = { cat1: 0.416, cat2: 0.416, apple: 0.25, bananas: 0.24 }; // px per natural px

// ---------- tiny audio ----------
let actx = null;
function blip(freq = 520, dur = 0.12, type = 'square') {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime); o.frequency.exponentialRampToValueAtTime(freq * 0.55, actx.currentTime + dur);
    g.gain.setValueAtTime(0.06, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

// ---------- stage drawing ----------
function setupCanvas(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = 480 * dpr; cv.height = 360 * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx;
}
const sx = x => 240 + x, sy = y => 180 - y;
function drawSprite(ctx, name, x, y, flip) {
  const im = IMG[name]; if (!im || !im.complete || !im.naturalWidth) return;
  const w = im.naturalWidth * SIZE[name], h = im.naturalHeight * SIZE[name];
  ctx.save(); ctx.translate(sx(x), sy(y)); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}
function spriteBox(name, x, y, inset = 0.72) {
  const im = IMG[name]; const w = (im.naturalWidth || 200) * SIZE[name] * inset, h = (im.naturalHeight || 200) * SIZE[name] * inset;
  return { l: x - w / 2, r: x + w / 2, b: y - h / 2, t: y + h / 2 };
}
const overlap = (a, b) => a.l < b.r && a.r > b.l && a.b < b.t && a.t > b.b;
function drawSky(ctx) { if (IMG.sky.complete && IMG.sky.naturalWidth) ctx.drawImage(IMG.sky, 0, 0, 480, 360); else { ctx.fillStyle = '#99ffff'; ctx.fillRect(0, 0, 480, 360); } }
function drawBubble(ctx, text, x, y) {
  ctx.save(); ctx.font = '600 14px Lexend, system-ui, sans-serif';
  const w = Math.min(220, ctx.measureText(text).width + 24), h = 34;
  let bx = sx(x) + 30, by = sy(y) - 80; if (bx + w > 474) bx = sx(x) - 30 - w;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  ctx.beginPath(); const tx = bx < sx(x) ? bx + w - 26 : bx + 18; ctx.moveTo(tx, by + h - 1); ctx.lineTo(tx + 8, by + h + 12); ctx.lineTo(tx + 14, by + h - 1); ctx.fill();
  ctx.fillStyle = '#575e75'; ctx.textBaseline = 'middle'; ctx.fillText(text, bx + 12, by + h / 2, w - 24); ctx.restore();
}
function drawMonitor(ctx, label, val, i) {
  ctx.save(); ctx.font = '600 12px Lexend, system-ui, sans-serif';
  const lw = ctx.measureText(label).width; const vw = Math.max(28, ctx.measureText(String(val)).width + 16);
  const x = 6, y = 6 + i * 26, w = lw + vw + 22;
  ctx.fillStyle = 'rgba(230,240,255,.95)'; ctx.strokeStyle = '#c4ccdf'; ctx.beginPath(); ctx.roundRect(x, y, w, 22, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#575e75'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + 7, y + 11);
  ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.roundRect(x + lw + 14, y + 3, vw, 16, 4); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(String(val), x + lw + 14 + vw / 2, y + 11); ctx.restore();
}

// ---------- Fruit Catch game simulator ----------
let activeGame = null;
class FruitGame {
  constructor(host, level) {
    this.level = level; this.host = host;
    const bar = el('div', { class: 'stagebar' });
    this.flagBtn = el('button', { class: 'btn flag', type: 'button', 'aria-label': 'Green flag: start' }, '⚑ Start');
    this.stopBtn = el('button', { class: 'btn stop', type: 'button', 'aria-label': 'Stop' }, '■ Stop');
    this.info = el('span', { class: 'readout', 'aria-live': 'polite' }, '');
    bar.append(this.flagBtn, this.stopBtn, this.info);
    this.box = el('div', { class: 'stagebox', tabindex: '0', 'aria-label': 'Game stage. Use left and right arrow keys after pressing Start.' });
    this.cv = el('canvas', { width: 480, height: 360 }); this.box.appendChild(this.cv);
    host.append(bar, this.box);
    if (level >= 2) {
      const tp = el('div', { class: 'touchpad' });
      this.lb = el('button', { type: 'button', 'aria-label': 'Move left' }, '←'); this.rb = el('button', { type: 'button', 'aria-label': 'Move right' }, '→');
      tp.append(this.lb, this.rb); host.appendChild(tp);
      const hold = (dir, btn) => { let t = null; const go = e => { e.preventDefault(); this.press(dir); clearInterval(t); t = setInterval(() => this.press(dir), 90); }; const end = () => clearInterval(t); btn.addEventListener('pointerdown', go); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, end)); };
      hold(1, this.rb); hold(-1, this.lb);
    }
    this.ctx = setupCanvas(this.cv);
    this.flagBtn.onclick = () => this.start(); this.stopBtn.onclick = () => this.stop(true);
    this.reset(); this.running = false; this.over = false;
    const draw = () => this.draw(); Object.values(IMG).forEach(i => i.complete ? 0 : i.addEventListener('load', draw)); this.draw();
    this.updateInfo();
  }
  reset() {
    this.cat = { x: 0, y: -120, dir: 90, cos: 0 }; this.say = null; this.score = 0; this.lives = 3; this.speed = -4;
    this.apple = { x: this.level === 1 ? 110 : 0, y: this.level === 1 ? 120 : 150, vis: true, rep: 0 };
    this.ban = { x: 120, y: 150, vis: false, state: 'wait', t: 0 }; this.over = false; this.stopMsg = null;
  }
  top(o) { o.x = Math.round(Math.random() * 400 - 200); o.y = 170; }
  start() {
    if (activeGame && activeGame !== this) activeGame.stop(false);
    activeGame = this; this.reset(); this.running = true; this.frame = 0;
    this.say = { text: 'Catch the apples!', until: 60 };
    if (this.level >= 3) this.top(this.apple);
    if (this.level >= 6) { this.ban.t = 30 * (4 + Math.random() * 4); blip(660, .2, 'triangle'); }
    this.box.focus({ preventScroll: true });
    cancelAnimationFrame(this.raf); this.last = performance.now(); this.acc = 0;
    const loop = now => { this.acc += now - this.last; this.last = now; let n = 0; while (this.acc >= 1000 / 30 && n < 4) { this.step(); this.acc -= 1000 / 30; n++; } this.draw(); if (this.running) this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  stop(user) { this.running = false; cancelAnimationFrame(this.raf); if (user) { this.stopMsg = 'Stopped'; } this.draw(); this.updateInfo(); }
  press(dir) {

    const L = this.level, a = this.apple, catB = spriteBox(this.cat.cos ? 'cat2' : 'cat1', this.cat.x, this.cat.y, 0.62);
    if (this.overT != null) { if (this.frame > this.overT) { this.running = false; this.say = null; this.stopMsg = 'Game over'; this.updateInfo(); } return; }
    if (L === 3) { a.y -= 5; a.rep++; if (a.rep >= 65) { a.rep = 0; this.top(a); } }
    if (L === 4) {

      if (a.y < -160) this.top(a);
    }
    if (L >= 5 && a.vis) {
      a.y += this.speed;
      if (overlap(spriteBox('apple', a.x, a.y), catB)) { this.score++; this.speed -= 0.5; blip(440); this.top(a); }
      if (a.y < -160) { this.lives--; blip(160, .18, 'sawtooth'); this.top(a); }

    const c = this.ctx; drawSky(c);

    drawSprite(c, this.cat.cos ? 'cat2' : 'cat1', this.cat.x, this.cat.y, this.cat.dir < 0);
    if (this.say) drawBubble(c, this.say.text, this.cat.x, this.cat.y);
    if (this.level >= 4) drawMonitor(c, 'score', this.score, 0);

      c.fillStyle = '#fff'; c.font = '700 26px Fredoka, system-ui, sans-serif'; c.textAlign = 'center';
      c.fillText(this.stopMsg === 'Game over' ? 'Game over! Score: ' + this.score : 'Press ⚑ Start', 240, 172);
      c.font = '500 14px Lexend, system-ui, sans-serif';
      c.fillText(this.level >= 2 ? 'Then use ← and → to move the cat' : 'Watch what the cat’s script does', 240, 198);
      c.restore();

}

function builder(b) {
  const box = el('div', { class: 'builder' });
  const canvas = el('div', { class: 'canvas' });
  const side = el('div');
  const steps = b.lines.map((l, i) => i).filter(i => b.lines[i][0] !== 'end');
  let k = steps.length - 1, timer = null;
  side.innerHTML = `<div class="code-card" style="background:transparent;border:0;padding:0"><h4><img src="media/${b.sprite}.png" alt="">${b.name}</h4></div>`;
  const counter = el('p', { class: 'eyebrow' }); const say = el('p', { class: 'say' }); const chip = el('span', { class: 'added' });
  const prog = el('div', { class: 'progress' }, '<i></i>');
  const prev = el('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Previous block' }, '◀');
  const play = el('button', { class: 'btn', type: 'button' }, '▶ Watch it build');
  const next = el('button', { class: 'btn ghost', type: 'button', 'aria-label': 'Next block' }, '▶|');
  const ctrls = el('div', { class: 'ctrls' }); ctrls.append(prev, play, next, prog);
  side.append(counter, chip, say, ctrls);
  const render = (anim) => {
    const upto = steps[k]; let depth = 0; const lines = [];
    for (let i = 0; i <= upto; i++) { const t = b.lines[i][0]; lines.push(t); if (/^(forever|repeat|if )/.test(t)) depth++; if (t === 'end') depth--; }
    for (let i = upto + 1; i < b.lines.length && b.lines[i][0] === 'end' && depth > 0; i++) { lines.push('end'); depth--; }
    while (depth-- > 0) lines.push('end');
    const svg = blocksSVG(lines.join('\n'), 0.9); if (anim && !reduceMotion) svg.classList.add('snap');
    canvas.replaceChildren(svg);
    const L = b.lines[upto];
    counter.textContent = `Block ${k + 1} of ${steps.length}`;
    chip.style.background = catColor(L[1]); chip.style.color = L[1] === 'events' || L[1] === 'control' ? '#2f2200' : '#fff';
    chip.textContent = '+ ' + L[1].charAt(0).toUpperCase() + L[1].slice(1) + ' block';
    say.textContent = L[2] || 'This block closes the loop above it.';
    prog.firstChild.style.width = ((k + 1) / steps.length * 100) + '%';
    prev.disabled = k === 0; next.disabled = k === steps.length - 1;
  };
  const stopPlay = () => { clearInterval(timer); timer = null; play.textContent = '▶ Watch it build'; };
  prev.onclick = () => { stopPlay(); k = Math.max(0, k - 1); render(true); };
  next.onclick = () => { stopPlay(); k = Math.min(steps.length - 1, k + 1); render(true); };
  play.onclick = () => {
    if (timer) return stopPlay();
    if (k === steps.length - 1) k = -1;
    play.textContent = '❚❚ Pause';
    const adv = () => { k++; render(true); if (k >= steps.length - 1) stopPlay(); };
    adv(); timer = setInterval(adv, 2200);
  };
  box.append(canvas, side); render(false);
  return box;
}

    b1.className = 'bool' + (t ? ' true' : ''); b1.innerHTML = `&lt;touching (Sprite1)?&gt; <b>${t}</b>`;
    b2.className = 'bool' + (g ? ' true' : ''); b2.innerHTML = `&lt;(y position) &lt; -160&gt; <span class="mono">y=${ap.y}</span> <b>${g}</b>`;
    act.innerHTML = t ? '<b>Catch!</b> The first if runs: score + 1, crunch sound, back to the top.' : g ? '<b>Missed.</b> The second if runs: back to the top (and from Lesson 5, lose a life).' : 'Both conditions are <b>false</b>, so the code inside both if blocks is skipped. The apple just keeps falling.';
  };
  let drag = false;
  const pos = e => { const r = cv.getBoundingClientRect(); ap.x = Math.round((e.clientX - r.left) / r.width * 480 - 240); ap.y = Math.round(180 - (e.clientY - r.top) / r.height * 360); ap.x = Math.max(-230, Math.min(230, ap.x)); ap.y = Math.max(-180, Math.min(175, ap.y)); draw(); };
  cv.addEventListener('pointerdown', e => { drag = true; cv.setPointerCapture(e.pointerId); pos(e); });
  cv.addEventListener('pointermove', e => { if (drag) pos(e); }); cv.addEventListener('pointerup', () => drag = false);
  sbx.tabIndex = 0; sbx.setAttribute('aria-label', 'Condition stage. Arrow keys move the apple.');
  sbx.addEventListener('keydown', e => { const m = { ArrowLeft: [-10, 0], ArrowRight: [10, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] }[e.key]; if (m) { e.preventDefault(); ap.x += m[0]; ap.y += m[1]; draw(); } });
  right.append(el('h4', {}, 'Live conditions'), b1, b2, act, blocksSVG('if <touching (Sprite1 v)?> then\n  change [score v] by (1)\nend\nif <(y position) < [-160]> then\n  go to x: (pick random (-200) to (200)) y: (170)\nend', 0.62));
  w.append(left, right); Object.values(IMG).forEach(i => i.addEventListener('load', draw)); draw();
  return w;
}

function trace() {
  const rows = [['Green flag clicked', 0, 3, -4], ['Catch an apple', 1, 3, -4.5], ['Catch an apple', 2, 3, -5], ['Miss an apple', 2, 2, -5], ['Catch an apple', 3, 2, -5.5], ['Miss an apple', 3, 1, -5.5], ['Miss an apple', 3, 0, -5.5]];
  const w = el('div'); const tw = el('div', { class: 'tablewrap' });
  const t = el('table', { class: 'trace' });
  t.innerHTML = '<thead><tr><th>#</th><th>Event</th><th>score</th><th>lives</th><th>speed</th></tr></thead>';
  const tb = el('tbody'); const inputs = [];
  rows.forEach((r, i) => {
    const tr = el('tr'); tr.appendChild(el('td', {}, String(i + 1))); tr.appendChild(el('td', { class: 'ev' }, r[0]));
    for (let c = 1; c <= 3; c++) {
      const td = el('td');
      if (i === 0) td.innerHTML = `<b>${r[c]}</b>`; else { const inp = el('input', { type: 'text', inputmode: 'decimal', 'aria-label': `${['score', 'lives', 'speed'][c - 1]} after event ${i + 1}`, id: `tr-${i}-${c}` }); inp.dataset.ans = r[c]; inputs.push(inp); td.appendChild(inp); }
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t);
  const fb = el('p', { class: 'fb' }); fb.hidden = true;
  const check = el('button', { class: 'btn', type: 'button' }, 'Check my table');
  const showA = el('button', { class: 'btn ghost', type: 'button' }, 'Show answers');
  check.onclick = () => { let ok = 0; inputs.forEach(i => { const good = parseFloat(i.value) === parseFloat(i.dataset.ans); i.className = good ? 'ok' : 'no'; if (good) ok++; }); fb.hidden = false; fb.className = 'fb ' + (ok === inputs.length ? 'ok' : 'no'); fb.innerHTML = ok === inputs.length ? '<b>Perfect trace!</b> After event 7, lives = 0, so the apple broadcasts game over.' : `${ok} / ${inputs.length} correct. Remember: speed only changes on a catch, lives only on a miss.`; };
  showA.onclick = () => { inputs.forEach(i => { i.value = i.dataset.ans; i.className = 'ok'; }); };
  const c = el('div', { class: 'ctrls' }); c.append(check, showA);
  w.append(tw, c, fb); return w;
}

function parsons(a) {
  const w = el('div');
  const all = [...a.answer.map((t, i) => ({ t, i })), ...a.distract.map(t => ({ t, i: -1 }))].sort(() => Math.random() - 0.5);
  let chosen = [];
  const g = el('div', { class: 'parsons' }); const pool = el('div', { class: 'pz' }, '<h5>Blocks</h5>'); const ans = el('div', { class: 'pz' }, '<h5>Your script</h5>');
  const fb = el('p', { class: 'fb' }); fb.hidden = true;
  const draw = () => {
    pool.querySelectorAll('.pitem').forEach(n => n.remove()); ans.querySelectorAll('.pitem').forEach(n => n.remove());
    all.forEach(it => { if (chosen.includes(it)) return; const b = el('button', { class: 'pitem', type: 'button', 'aria-label': 'Add block: ' + it.t }); b.appendChild(blocksSVG(it.t, 0.62)); b.onclick = () => { chosen.push(it); draw(); }; pool.appendChild(b); });
    chosen.forEach((it, k) => {
      const row = el('div', { class: 'pitem' }); row.appendChild(blocksSVG(it.t, 0.62));
      const mv = el('span', { class: 'mv' });
      mv.append(el('button', { type: 'button', 'aria-label': 'Move up', onclick: () => { if (k > 0) { [chosen[k - 1], chosen[k]] = [chosen[k], chosen[k - 1]]; draw(); } } }, '↑'), el('button', { type: 'button', 'aria-label': 'Move down', onclick: () => { if (k < chosen.length - 1) { [chosen[k + 1], chosen[k]] = [chosen[k], chosen[k + 1]]; draw(); } } }, '↓'), el('button', { type: 'button', 'aria-label': 'Remove', onclick: () => { chosen.splice(k, 1); draw(); } }, '✕'));
      row.appendChild(mv); ans.appendChild(row);
    });
  };
  const check = el('button', { class: 'btn', type: 'button' }, 'Check');
  const reset = el('button', { class: 'btn ghost', type: 'button' }, '↺ Reset');
  check.onclick = () => {
    fb.hidden = false; const ok = chosen.length === a.answer.length && chosen.every((it, k) => it.i === k);
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = ok ? '<b>Correct!</b> The hat block goes first, then face left, move left, and change costume.' : chosen.some(c => c.i === -1) ? 'One of your blocks is the trap. Moving left changes x, not y.' : chosen.length < a.answer.length ? 'Not finished yet. You need 4 blocks.' : 'Check the order. Which block has to be at the top?';
  };
  reset.onclick = () => { chosen = []; fb.hidden = true; draw(); };
  g.append(pool, ans); const c = el('div', { class: 'ctrls' }); c.append(check, reset);
  w.append(g, c, fb); draw(); return w;
}

  <div><h3 style="margin-bottom:10px">Lesson timing (60 min)</h3><table class="plain"><tbody>${PHASES.map(p => `<tr><td><span class="tag${p.id === 'youdo' ? ' dark-text' : ''}" style="--pc:${p.c}">${p.name}</span></td><td>${p.mins}</td><td>${{ starter: 'Retrieval quiz, cold-call answers', ido: 'Play video or demo live; watch the block build', wedo: 'Step-by-step, everyone at the same step; check screens', activity: 'Interactive practice, pairs work well', youdo: 'Independent challenges, bronze → gold', exit: 'Individual; use to plan next lesson' }[p.id]}</td></tr>`).join('')}</tbody></table></div>`;
  v.appendChild(p2);

  const p3 = el('section', { class: 'panel' });
  p3.innerHTML = `<div class="sec-head"><h2>Common misconceptions</h2></div><div class="tablewrap"><table class="plain"><thead><tr><th>Lesson</th><th>Misconception</th><th>What to say or do</th></tr></thead><tbody>
  <tr><td>1</td><td>Blocks run just because they are in the code area.</td><td>Only blocks attached under a hat block run when the flag is clicked. Drag a loose block away and test.</td></tr>
  <tr><td>1</td><td>y gets bigger going down (like reading a page).</td><td>Use the coordinate explorer: up is positive, like a maths graph.</td></tr>
  <tr><td>2</td><td>The cat walks upside down: “Scratch is broken”.</td><td>Show rotation style. Direction -90 rotates the sprite unless it is set to left-right.</td></tr>
  <tr><td>3</td><td>Putting “forever” inside the apple’s fall instead of “repeat”.</td><td>Ask: when does a forever loop end? Then the code after it never runs.</td></tr>
  <tr><td>4</td><td>Score jumps by lots for one catch.</td><td>The if is checked every frame. After scoring the apple must move away (back to the top).</td></tr>
  <tr><td>4</td><td>Score carries over between games.</td><td>Variables keep values. Initialise with set score to 0 on green flag.</td></tr>
  <tr><td>5</td><td>A negative speed means slower.</td><td>Negative means direction (down). Bigger negative = faster down. Use the trace table.</td></tr>
  <tr><td>5</td><td>Broadcast and receive must be in the same sprite.</td><td>Broadcasts go to every sprite and the stage. That is the point of them.</td></tr></tbody></table></div>`;
  v.appendChild(p3);

  const p4 = el('section', { class: 'panel grid2' });
  p4.innerHTML = `<div><h3 style="margin-bottom:10px">Adaptive teaching</h3><ul class="objectives">
  <li><b>Support:</b> pair students at the We do stage; print the We do screenshots; let them watch the I do video again at their own pace with headphones.</li>
  <li><b>Support:</b> the block-by-block build animation can be paused and stepped back. It shows the exact block and colour to look for.</li>
  <li><b>Stretch:</b> gold challenges introduce ideas from later lessons (selection in Lesson 2, high score in Lesson 5).</li>
  <li><b>Stretch:</b> ask early finishers to write a test for their partner’s game, or to explain their code using the key words.</li>
  <li><b>Reading:</b> the page uses Lexend, a typeface designed to support reading fluency. Key words have flip cards with short definitions.</li></ul></div>
  <div><h3 style="margin-bottom:10px">Assessment</h3><ul class="objectives">
  <li><b>Exit tickets:</b> three questions per lesson. Ask students to show their score before leaving (it is saved only on their device).</li>
  <li><b>Project:</b> check each student’s Scratch project against the lesson’s “Your game after Lesson N” preview.</li>
  <li><b>Lesson 5 trace table:</b> a good check of whether students understand variables, not just copying blocks.</li>
  <li><b>Lesson 6 test plan & peer review:</b> evidence of testing and evaluation.</li>
  <li><b>Key Stage 3 links:</b> designing and debugging programs, using selection and repetition, using variables, simple Boolean logic (and, or, not), and evaluating solutions.</li></ul></div>`;
  v.appendChild(p4);

  const p5 = el('section', { class: 'panel' });
  p5.innerHTML = `<div class="sec-head"><h2>Before Lesson 1</h2></div><ul class="objectives">
  <li>Make sure every student can log in to Scratch. A Scratch Teacher Account lets you create student accounts for a class without email addresses.</li>
  <li>Check scratch.mit.edu is not blocked on student machines, and that sound works (headphones help for the Chomp sound).</li>
  <li>Students should save with <b>File → Save now</b> at the end of every lesson. Their project carries on from lesson to lesson.</li>
  <li>The demo videos and screenshots on this page were recorded from the real Scratch editor, so they match what students see.</li></ul>`;
  v.appendChild(p5);
  return v;
}

// ---------- router ----------
function route() {
  const h = (location.hash || '#overview').slice(1);
  const L = LESSONS.find(x => x.id === h);
  current = L ? L.id : h === 'teacher' ? 'teacher' : 'overview';
  if (activeGame) { activeGame.stop(false); activeGame = null; }
  const main = $('#main');
  main.replaceChildren(L ? viewLesson(L) : current === 'teacher' ? viewTeacher() : viewOverview());
  renderNav();
  window.scrollTo({ top: 0, behavior: 'auto' });
  try { store.set('last', current); } catch (e) {}
}
window.addEventListener('hashchange', route);
route();
</script>
