<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit Catch Quest</title>
<meta name="description" content="Year 7 Unit 6 – Scratch: build the Fruit Catch game over six levels, with demo videos, block-by-block builds, step-by-step screenshots, stage simulators and bronze, silver and gold challenges.">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f8; --text:#122033; --muted:#526075; --border:#d8dfea;
  --primary:#7c4dcc; --primary-ink:#ffffff; --primary-soft:#ece4fb; --accent:#f59e0b; --accent-soft:#fff4dc;
  --ok:#15803d; --ok-soft:#dcf5e5; --bad:#b91c1c; --bad-soft:#fde4e4; --warn:#b45309; --warn-soft:#fff1d6; --info:#1d4ed8; --info-soft:#e0eaff;
  --cpu:#2563eb; --ram:#7c3aed; --sto:#ea580c; --net:#0d9488; --io:#db2777;
  --on:#16a34a; --off:#94a3b8;
  --shadow:0 1px 2px rgba(18,32,51,.06),0 4px 16px rgba(18,32,51,.06);
  --r:12px; --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; --mono:Consolas,"Cascadia Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1624; --surface:#18233a; --surface-2:#1f2c46; --text:#eef2f8; --muted:#a3b0c4; --border:#2d3c5a;
    --primary:#a78bfa; --primary-ink:#0f1624; --primary-soft:#2e2350; --accent:#fbbf24; --accent-soft:#3a2f12;
    --ok:#4ade80; --ok-soft:#163626; --bad:#f87171; --bad-soft:#3d1a1d; --warn:#fbbf24; --warn-soft:#3a2f12; --info:#93b4ff; --info-soft:#1c2b50;
    --cpu:#60a5fa; --ram:#a78bfa; --sto:#fb923c; --net:#2dd4bf; --io:#f472b6; --on:#4ade80; --off:#64748b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1624; --surface:#18233a; --surface-2:#1f2c46; --text:#eef2f8; --muted:#a3b0c4; --border:#2d3c5a;
  --primary:#a78bfa; --primary-ink:#0f1624; --primary-soft:#2e2350; --accent:#fbbf24; --accent-soft:#3a2f12;
  --ok:#4ade80; --ok-soft:#163626; --bad:#f87171; --bad-soft:#3d1a1d; --warn:#fbbf24; --warn-soft:#3a2f12; --info:#93b4ff; --info-soft:#1c2b50;
  --cpu:#60a5fa; --ram:#a78bfa; --sto:#fb923c; --net:#2dd4bf; --io:#f472b6; --on:#4ade80; --off:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.875rem} h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0 0 .75em;max-width:72ch}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:16px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid3{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:1.05rem;background:none;border:0;padding:4px;text-align:left}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:var(--primary-ink)}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:.75rem}
.xpbox{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:220px}
.rank{font-weight:700;font-size:.85rem;white-space:nowrap}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border);flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width .5s}
.xpnum{font-weight:800;color:var(--primary);font-size:.9rem;white-space:nowrap}
.navbtns{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;min-height:40px;padding:6px 12px;font-weight:600;font-size:.9rem}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- generic ---------- */
main{max-width:1240px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.card.tight{padding:16px}
.btn{border:0;border-radius:10px;min-height:44px;padding:10px 20px;font-weight:700;background:var(--primary);color:var(--primary-ink);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{background:none;color:var(--primary);padding:10px 12px}
.btn.ok{background:var(--ok);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border)}
.callout{border-left:5px solid var(--info);background:var(--info-soft);padding:12px 16px;border-radius:8px;margin:12px 0}
.callout.tip{border-color:var(--accent);background:var(--accent-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.callout.def{border-color:var(--primary);background:var(--primary-soft)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout>:last-child{margin-bottom:0}
.fb{margin-top:8px;font-weight:600;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- home ---------- */
.hero{display:grid;gap:24px;grid-template-columns:1fr;align-items:center;margin-bottom:24px}
@media(min-width:900px){.hero{grid-template-columns:1.3fr 1fr}}
.hero h1{font-size:2.1rem}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--primary)}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.layers{display:grid;gap:6px;margin-top:16px}
.layers div{border-radius:10px;padding:8px 14px;font-weight:700;color:#fff;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.layers small{font-weight:600;opacity:.9}
.map{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.map{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.map{grid-template-columns:repeat(4,1fr)}}
.lvl{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:210px;border-top:6px solid var(--lc,var(--primary))}
.lvl:hover:not([disabled]){transform:translateY(-2px);transition:transform .15s}
.lvl[disabled]{opacity:.6;cursor:not-allowed}
.lvl .num{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lc)}
.lvl .ico{font-size:2rem;line-height:1}
.lvl h3{margin:0;font-size:1.1rem}
.lvl .q{color:var(--muted);font-size:.9rem;flex:1}
.lvl .stars{font-size:.85rem;font-weight:700}
.lvl .lock{position:absolute;top:16px;right:16px;font-size:1.3rem}
.minibar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--lc,var(--primary))}
.badges{display:flex;gap:12px;flex-wrap:wrap}
.badge{width:96px;text-align:center;font-size:.75rem;font-weight:700;color:var(--muted)}
.badge .b{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:var(--surface-2);border:3px dashed var(--border);filter:grayscale(1);opacity:.55}
.badge.got .b{filter:none;opacity:1;border:3px solid var(--accent);background:var(--accent-soft)}
.badge.got{color:var(--text)}

/* ---------- lesson ---------- */
.lhead{border-radius:16px;padding:24px;color:#fff;background:var(--lc);position:relative;overflow:hidden;margin-bottom:16px}
.lhead::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.lhead .k{font-weight:800;letter-spacing:.06em;font-size:.8rem;text-transform:uppercase;opacity:.9}
.lhead h1{margin:.2em 0 .3em;color:#fff}
.lhead .bq{font-size:1.15rem;font-weight:600}
.objs{display:grid;gap:8px;margin-top:12px}
.obj{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.95rem}
.obj .tk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:.8rem}
.obj.met .tk{background:#fff;color:var(--lc)}
.lwrap{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:960px){.lwrap{grid-template-columns:260px minmax(0,1fr)}}
.steps{display:flex;flex-direction:column;gap:6px}
@media(max-width:959px){.steps{flex-direction:row;overflow-x:auto;padding-bottom:6px}.steps .st{min-width:150px}}
.st{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem;min-height:52px}
.st .d{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.95rem}
.st small{display:block;font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.st.cur{border:2px solid var(--lc);background:var(--primary-soft)}
.st.done .d{background:var(--ok);color:#fff}
.stage-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stype{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:99px;color:#fff;background:var(--lc)}
.objref{font-size:.85rem;color:var(--muted);font-weight:600}
.stage-f{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.gradual{display:flex;gap:4px;align-items:center;font-size:.75rem;font-weight:700;color:var(--muted)}
.gradual span{padding:3px 8px;border-radius:99px;background:var(--surface-2)}
.gradual span.on{background:var(--lc);color:#fff}

/* ---------- widgets ---------- */
.q{margin-bottom:20px}
.qtext{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{font-size:.92rem;margin-top:6px;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{border:2px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-height:48px;font-weight:600;font-size:.95rem}
.mi.sel{border-color:var(--primary);background:var(--primary-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border:2px dashed var(--border);border-radius:12px;background:var(--surface-2)}
.chip{border:2px solid var(--border);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.92rem;min-height:40px}
.chip.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary-soft)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.bins{display:grid;gap:12px;grid-template-columns:1fr;margin-top:12px}
@media(min-width:640px){.bins{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.bin{border:2px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);min-height:120px;text-align:left;display:flex;flex-direction:column;gap:8px}
.bin.hot{border-color:var(--primary);background:var(--primary-soft)}
.bin h4{margin:0;display:flex;gap:8px;align-items:center}
.bin .inner{display:flex;flex-wrap:wrap;gap:6px}
.ord{list-style:none;padding:0;margin:0;display:grid;gap:8px;counter-reset:o}
.ord li{display:flex;gap:10px;align-items:center;border:2px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface);counter-increment:o}
.ord li::before{content:counter(o);flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.ord li.good{border-color:var(--ok);background:var(--ok-soft)}
.ord li.badpos{border-color:var(--warn);background:var(--warn-soft)}
.ord li span{flex:1;font-weight:600}
.ord li.drag{opacity:.4}
.mv{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:36px;height:36px;font-weight:800}
.gap select{border:2px solid var(--primary);border-radius:8px;padding:4px 8px;background:var(--surface);font-weight:700;min-height:36px;margin:2px}
.gap select.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap select.bad{border-color:var(--bad);background:var(--bad-soft)}
.gap .line{margin:8px 0;line-height:2.2}
textarea,input[type=text],input[type=number]{width:100%;border:2px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);min-height:44px}
textarea{min-height:150px;line-height:1.6}
textarea:focus,input:focus{border-color:var(--primary);outline:none}
label.lab{display:block;font-weight:700;margin:12px 0 6px}
.checks{display:grid;gap:6px;margin:12px 0}
.checks label{display:flex;gap:10px;align-items:center;font-weight:600}
.checks input{width:20px;height:20px;flex:none}
.hintbox{margin-top:12px}
.hint{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:6px;margin-top:8px;font-weight:600}
.levels{display:grid;gap:12px;grid-template-columns:1fr;margin:12px 0 20px}
@media(min-width:700px){.levels{grid-template-columns:repeat(3,1fr)}}
.lvlpick{border:2px solid var(--border);border-radius:14px;padding:16px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-height:130px}
.lvlpick b{font-size:1.05rem}
.lvlpick .xp{font-size:.8rem;font-weight:800;color:var(--primary)}
.lvlpick.on{border-color:var(--lc);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary-soft)}
.lvlpick .done{color:var(--ok);font-weight:800;font-size:.8rem}
.flip{perspective:900px;border:0;background:none;padding:0;min-height:170px;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:16px;border:2px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;text-align:center}
.flip .fb2{transform:rotateY(180deg);background:var(--primary-soft);border-color:var(--primary)}
.flip .big{font-size:2.4rem;line-height:1}
.flip h4{margin:0}
.model{border:2px solid var(--border);border-radius:14px;overflow:hidden}
.model .mh{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);padding:10px 16px;font-weight:700;gap:12px;flex-wrap:wrap}
.model .mb{padding:20px}
.think{display:flex;gap:12px;align-items:flex-start;background:var(--info-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.think .av{font-size:1.8rem;line-height:1}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;z-index:50;transition:transform .3s,opacity .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{max-width:460px;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.trace{width:100%;border-collapse:collapse;font-size:.95rem}
.trace th,.trace td{border:1px solid var(--border);padding:6px 8px;text-align:center}
.trace th{background:var(--surface-2)}
.trace tr.cur td{background:var(--accent-soft);font-weight:800}
.trace select{min-height:36px;border:2px solid var(--primary);border-radius:8px;background:var(--surface);font-weight:800;padding:2px 6px}
.trace select.ok{border-color:var(--ok);background:var(--ok-soft)}
.trace select.bad{border-color:var(--bad);background:var(--bad-soft)}
.ko{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.ko{grid-template-columns:repeat(2,1fr)}}
.kwrow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.kwrow .ic{font-size:1.6rem;text-align:center}
.pipe{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.pipe-s{flex:1;min-width:130px;border:2px solid var(--border);border-radius:14px;padding:12px;text-align:center;background:var(--surface)}
.pipe-a{display:grid;place-items:center;font-size:1.5rem;color:var(--primary)}
.blitz{border:2px solid var(--border);border-radius:16px;padding:24px;background:var(--surface-2)}
.blitz .bq{font-size:1.5rem;font-weight:800;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:16px}
.tbar{height:10px;border-radius:99px;background:var(--border);overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--accent),var(--bad))}
.hpbar{height:16px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:4px}.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#dc2626,#f97316);transition:width .5s}
.boss{font-size:4rem;line-height:1}
.boss.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-10px) rotate(-10deg);filter:brightness(2)}60%{transform:translateX(10px) rotate(8deg)}}

/* ---------- simulations ---------- */
.sim{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.sim{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.svgbox{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;justify-content:center;overflow:hidden}
.svgbox svg{max-width:100%;height:auto;display:block}
.screen{border:10px solid #1e293b;border-radius:16px;background:#0b1220;color:#e2e8f0;min-height:230px;padding:16px;position:relative}
.screen .title{font-family:var(--mono);font-size:.8rem;color:#94a3b8;margin-bottom:8px}

.keys{display:flex;gap:4px}

.keys button.hit{background:#fbbf24}
.appgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.appbtn{border:2px solid var(--border);border-radius:12px;background:var(--surface);padding:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}

.appbtn.on{border-color:var(--primary);background:var(--primary-soft)}

.cpu{display:grid;gap:16px;grid-template-columns:1fr}

.reg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.regbox{border:3px solid var(--cpu);border-radius:10px;padding:8px 10px;background:var(--surface)}

.regbox b{font-family:var(--mono);font-size:1.25rem}
.regbox.chg{box-shadow:0 0 0 5px var(--accent-soft)}
.phase{display:flex;gap:6px}
.phase span{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--surface-2);font-weight:800;border:2px solid transparent}
.phase span.on{background:var(--cpu);color:#fff}
.lane{display:flex;gap:2px;flex-wrap:wrap;min-height:30px;padding:4px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);align-content:flex-start}
.lane i{width:14px;height:22px;border-radius:3px;display:block}
.progrow{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.gl{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.gl{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.sw{min-width:72px;min-height:56px;border-radius:12px;border:3px solid var(--off);background:var(--surface);font-weight:800;font-size:1.1rem}
.sw.on{border-color:var(--on);background:var(--on);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:42px;font-weight:700}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.circ text{font-family:var(--font)}
.circ .tog{cursor:pointer}
.circ .tog:focus{outline:none}
.circ .tog:focus-visible rect{stroke:var(--accent);stroke-width:4}
.fruitpool{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:10px;border:2px dashed var(--border);border-radius:12px;background:var(--surface-2)}
.fruit{border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:4px;width:72px;height:72px;display:grid;place-items:center}
.fruit.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.fruit svg{width:58px;height:58px}
.classbox{border:2px solid var(--border);border-radius:12px;padding:10px;background:var(--surface);min-height:110px;text-align:left;display:flex;flex-direction:column;gap:6px}
.classbox.hot{border-color:var(--primary)}
.classbox .inner{display:flex;flex-wrap:wrap;gap:4px}
.classbox .inner .fruit{width:48px;height:48px;padding:2px}
.classbox .inner .fruit svg{width:38px;height:38px}
.conf{height:14px;border-radius:99px;overflow:hidden;display:flex;border:1px solid var(--border)}
.conf i{display:block;height:100%}
.sblocks{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:.9rem;color:#fff}
.sb{border-radius:6px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;width:max-content;max-width:100%}
.sb .v{background:#fff;color:#333;border-radius:99px;padding:1px 9px}
.sb.ev{background:#c88b00;border-radius:14px 14px 6px 6px}
.sb.lk{background:#7c5cd6}.sb.ct{background:#d99a12}.sb.op{background:#4caf50}.sb.vr{background:#e87c1e}.sb.sn{background:#5c8de0}
.sb.in1{margin-left:22px}.sb.in2{margin-left:44px}
.elf{border:2px solid var(--border);border-radius:16px;padding:16px;background:linear-gradient(180deg,#e0f2fe,#f0fdf4);color:#0f172a;text-align:center}
.elf .who{font-size:3.4rem;line-height:1}
.elf .say{display:inline-block;background:#fff;border:2px solid #0f172a;border-radius:16px;padding:8px 14px;font-weight:700;margin:8px 0;max-width:100%}
.elf input{max-width:140px;text-align:center;font-size:1.2rem;background:#fff;color:#0f172a}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;font-weight:700}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.labs{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.labs{grid-template-columns:repeat(3,1fr)}}

/* ===== Binary Quest additions ===== */
.bits{display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:6px;max-width:760px}
.bitc{display:flex;flex-direction:column;align-items:center;gap:4px}
.bitc .pv{font-weight:800;font-size:.95rem;color:var(--muted);font-family:var(--mono)}
.bitbtn{width:100%;max-width:78px;aspect-ratio:3/4;border-radius:12px;border:3px solid var(--off);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-weight:900;font-size:1.7rem;color:var(--muted);cursor:pointer;transition:transform .12s,background .15s}
.bitbtn .sw{display:block;flex:none;width:22px;min-width:0;min-height:0;height:34px;border-radius:12px;background:var(--surface-2);border:2px solid var(--off);position:relative}
.bitbtn .sw::after{content:"";position:absolute;left:2px;right:2px;height:14px;bottom:2px;border-radius:8px;background:var(--off);transition:bottom .15s}
.bitbtn.on{background:var(--on);border-color:var(--on);color:#fff}
.bitbtn.on .sw{background:#bbf7d0;border-color:#fff}
.bitbtn.on .sw::after{bottom:16px;background:#fff}
.bitbtn:active{transform:scale(.96)}
.bitbtn[disabled]{cursor:default}
.bitbtn.lamp .sw{display:none}
.bitc .add{font-family:var(--mono);font-weight:800;font-size:.9rem;min-height:1.2em;color:var(--on)}
.bitbig{font-family:var(--mono);font-size:2rem;font-weight:900;letter-spacing:.12em}
.sumline{font-family:var(--mono);font-weight:800;font-size:1.15rem;background:var(--surface-2);border-radius:10px;padding:10px 14px;min-height:48px}
.pvt{border-collapse:collapse;font-family:var(--mono);font-size:1.15rem}
.pvt th,.pvt td{border:2px solid var(--border);min-width:44px;height:44px;text-align:center;font-weight:800}
.pvt th{background:var(--surface-2);color:var(--muted);font-size:.95rem}
.pvt td.one{background:var(--ok-soft);color:var(--ok)}
.pvt td.hl{outline:3px solid var(--accent);outline-offset:-3px}
.pvt td.lab{text-align:left;padding:0 10px;font-family:var(--font);font-size:.9rem;color:var(--muted);border:0;min-width:80px}
.pvt input{width:40px;height:38px;text-align:center;font-family:var(--mono);font-size:1.15rem;font-weight:900;border:2px solid var(--primary);border-radius:8px;background:var(--surface);color:var(--text)}
.pvt input.ok{border-color:var(--ok);background:var(--ok-soft)}
.pvt input.bad{border-color:var(--bad);background:var(--bad-soft)}
.pvt td.cur{background:var(--accent-soft)}
.adder td.carry{font-size:.9rem;color:var(--warn);height:28px}
.numin{width:130px!important;flex:none;min-height:46px;font-family:var(--mono);font-size:1.3rem;font-weight:900;text-align:center}
.ladder{display:flex;align-items:flex-end;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.ladder div{flex:1;min-width:72px;font-size:.9rem;border-radius:12px;color:#fff;font-weight:800;padding:10px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}
.ladder small{display:block;font-weight:600;opacity:.92}
.divtab td{font-family:var(--mono);font-weight:800;padding:4px 10px;border-bottom:1px solid var(--border)}
.divtab td.r{color:var(--on)}
.spy{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;font-family:var(--mono);font-size:.8rem}
.spy span{background:var(--surface-2);border-radius:6px;text-align:center;padding:3px 0}
@media print{.top,.stage-f,.steps,.navbtns{display:none!important}body{background:#fff}.card{box-shadow:none}}
/* ---------- Unit 6 Scratch ---------- */
:root{--motion:#4c97ff;--looks:#9966ff;--sound:#cf63cf;--events:#ffbf00;--control:#ffab19;--sensing:#5cb1d6;--operators:#59c059;--variables:#ff8c1a}
.sb-wrap{overflow-x:auto;max-width:100%}
.sb-wrap svg{display:block;max-width:none}
pre.blocks{font-family:var(--mono);font-size:.88rem;background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre;overflow-x:auto}
.shot{border-radius:10px;border:1px solid var(--border);width:100%;max-width:640px;height:auto;display:block;cursor:zoom-in}
figure{margin:0}
figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
.vidwrap{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#111;max-width:760px}
.vidwrap video{display:block;width:100%;height:auto;aspect-ratio:16/10}
.sclist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.scnote{font-size:.92rem;color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.scprog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1;min-width:80px}
.scprog i{display:block;height:100%;background:var(--primary);width:0;transition:width .3s}
/* builder */
.code-card{background:var(--surface-2);border-radius:12px;padding:12px;border:1px solid var(--border)}
.code-card h4{font-size:.95rem;display:flex;align-items:center;gap:8px;margin:0}
.code-card h4 img{width:26px;height:26px;object-fit:contain}
.builder{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.builder>div:last-child{display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.builder{grid-template-columns:minmax(0,1fr)}}
.builder .canvas{background:var(--surface-2);background-image:radial-gradient(rgba(120,120,160,.25) 1.2px,transparent 1.3px);background-size:18px 18px;border-radius:12px;border:1px solid var(--border);min-height:250px;padding:16px;overflow-x:auto}
.builder .snap{animation:scsnap .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes scsnap{from{transform:translateY(-8px);opacity:.4}to{transform:none;opacity:1}}
.scsay{font-size:1rem;margin:0}
.added{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-weight:700;font-size:.88rem;padding:6px 12px;border-radius:999px;color:#fff}
.btn.flag{background:#2f9e44;color:#fff}
.btn.stop{background:var(--bad);color:#fff}
/* steps */
.scsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.scstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);transition:border-color .2s,background .2s}
.scstep.done{border-color:var(--ok);background:var(--ok-soft)}
.scstep .chk{width:40px;height:40px;border-radius:12px;border:2px solid var(--border);background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--text);font-size:1.05rem;cursor:pointer}
.scstep.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.scstep h4{font-size:1.05rem;margin:0 0 4px}
.scstep .body{display:flex;flex-direction:column;gap:10px;min-width:0}
.scstep .body p{margin:0}
@media (max-width:560px){.scstep{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:12px}.scstep .chk{width:32px;height:32px;border-radius:9px;font-size:.9rem}}
/* stage */
.gamehost{display:flex;flex-direction:column;gap:8px}
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stagebox{position:relative;width:100%;max-width:480px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#9ff;touch-action:none}
.stagebox:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.stagebox canvas{width:100%;height:100%;display:block}
.touchpad{display:flex;gap:8px;max-width:480px}
.touchpad button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-2);font-size:1.2rem;color:var(--text);touch-action:none}
.readout{font-family:var(--mono);font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap}
.bool{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;font-family:var(--mono);font-size:.85rem;border:2px solid var(--border);background:var(--surface-2);transition:all .2s;align-self:flex-start}
.bool.true{background:var(--ok-soft);border-color:var(--ok)}
/* parsons */
.parsons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.parsons{grid-template-columns:minmax(0,1fr)}}
.pz{min-height:180px;border-radius:12px;border:2px dashed var(--border);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);min-width:0}
.pz h5{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pitem{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:2px;border-radius:8px;text-align:left;overflow-x:auto;cursor:pointer;color:var(--text)}
.pitem:hover{background:var(--primary-soft)}
.pmv{margin-left:auto;display:flex;gap:4px}
.pmv button{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:30px;height:30px;color:var(--text);cursor:pointer}
/* trace table */
.tablewrap{overflow-x:auto}
.sctrace,table.plain{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sctrace th,.sctrace td,table.plain th,table.plain td{border:1px solid var(--border);padding:7px 8px;text-align:center;font-size:.9rem}
table.plain td{text-align:left}
.sctrace th,table.plain th{background:var(--surface-2)}
.sctrace td.ev{text-align:left}
.sctrace input{width:64px;text-align:center;font:inherit;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:3px}
.sctrace input.ok{border-color:var(--ok);background:var(--ok-soft)}
.sctrace input.no{border-color:var(--bad);background:var(--bad-soft)}
table.plain select,table.plain input{font:inherit;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:4px;min-width:90px}
/* hotspot */
.schot{position:relative}
.schot img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--border)}
.schot .zone{position:absolute;border:0;background:transparent;border-radius:10px;cursor:pointer}
.schot .zone:focus-visible{outline:3px dashed var(--primary)}
.schot .zone.show{outline:4px solid var(--ok);background:rgba(31,157,85,.15)}
.schot .zone.miss{outline:4px solid var(--bad);background:rgba(214,69,69,.15)}
.hot-prompt{font-size:1.15rem;font-weight:800;margin:0 0 10px}
/* you do */
details.sol{border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--surface)}
details.sol summary{cursor:pointer;font-weight:700}
details.sol[open] summary{margin-bottom:10px}
.chkrow{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chkrow input{width:20px;height:20px}
/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(10,12,25,.86);z-index:200;display:grid;place-items:center;padding:16px}
.lightbox img{max-width:min(1400px,100%);max-height:100%;border-radius:10px}
.lightbox button{position:absolute;top:14px;right:14px}
@media (prefers-reduced-motion:reduce){.builder .snap{animation:none}}

const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

const STORE = UNIT.store;
let S = { xp: 0, done: {}, notes: {}, unlockAll: false, theme: null, name: '' };
try { const raw = localStorage.getItem(STORE); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { /* storage unavailable */ }

const RANKS = UNIT.ranks.map((n, i) => [[0, 120, 280, 460, 680, 940, 1220, 1520, 1850][i], n]);

  const i = rankOf(S.xp), cur = RANKS[i][0], nxt = RANKS[i + 1] ? RANKS[i + 1][0] : cur + 1;
  $('#rankName').textContent = `Lv ${i + 1} · ${RANKS[i][1]}`;
  $('#xpNum').textContent = `${S.xp} XP`;
  $('#xpBar').style.width = (RANKS[i + 1] ? Math.min(100, (S.xp - cur) / (nxt - cur) * 100) : 100) + '%';
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function confetti() {
  if (reduced()) return;
  const box = h('div', { class: 'confetti', 'aria-hidden': 'true' });
  const cols = ['#0f766e', '#f59e0b', '#16a34a', '#db2777', '#2563eb', '#7c3aed'];
  for (let i = 0; i < 70; i++) box.append(h('i', { style: `left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-delay:${Math.random() * .6}s` }));
  document.body.append(box); setTimeout(() => box.remove(), 2600);
}
function modal(title, body, btnText = 'Keep going') {
  const m = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  const close = () => m.remove();
  const b = h('button', { class: 'btn', onclick: close }, btnText);
  m.append(h('div', { class: 'card pop stack' }, h('h2', {}, title), typeof body === 'string' ? h('p', { html: body }) : body, b));
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

}
function award(key, xp, label) {
  if (S.done[key]) { toast('✅ Already completed — great practice!'); return false; }
  const before = rankOf(S.xp);
  S.done[key] = true; S.xp += xp; save(); refreshHeader();
  toast(`+${xp} XP · ${label || 'Step complete'} 🎉`);
  const after2 = rankOf(S.xp);
  if (after2 > before) { confetti(); modal('⬆️ Level up!', `You are now <b>Level ${after2 + 1}: ${RANKS[after2][1]}</b>.`); }
  return true;
}

/* =====================================================================
   WIDGETS — each calls onDone(ratio 0..1) once the learner finishes

function Quiz(questions, onDone, opts = {}) {
  const pass = opts.pass ?? 0.6;
  const wrap = h('div');
  function build() {
    wrap.innerHTML = '';
    let answered = 0, right = 0;
    const res = h('div', { class: 'fb', 'aria-live': 'polite' });
    questions.forEach((q, qi) => {
      const box = h('div', { class: 'q' }, h('div', { class: 'qtext' }, `${qi + 1}. `, q.q));
      if (q.visual) box.append(q.visual());
      const opsEl = h('div', { class: 'opts' });
      const why = h('div', { class: 'why' });
      const order = opts.keepOrder || q.keep ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
      order.forEach(oi => {
        const b = h('button', { class: 'opt' }, h('span', { 'aria-hidden': 'true' }, '○'), q.options[oi]);
        b.onclick = () => {
          [...opsEl.children].forEach(x => x.disabled = true);
          const ok = oi === q.a; answered++; if (ok) right++;
          b.classList.add(ok ? 'right' : 'wrong'); b.firstChild.textContent = ok ? '✓' : '✗';
          if (!ok) { const c = [...opsEl.children][order.indexOf(q.a)]; c.classList.add('right'); c.firstChild.textContent = '✓'; }
          why.innerHTML = (ok ? '<b style="color:var(--ok)">Correct!</b> ' : '<b style="color:var(--bad)">Not quite.</b> ') + (q.why || '');
          if (answered === questions.length) finish();
        };
        opsEl.append(b);
      });
      box.append(opsEl, why); wrap.append(box);
    });
    wrap.append(res);
    function finish() {
      const r = right / questions.length;
      res.className = 'fb ' + (r >= pass ? 'ok' : 'bad');
      res.textContent = `Score: ${right} / ${questions.length}. ` + (r >= pass ? 'Brilliant — you have shown you understand this!' : 'Re-read the explanations above, then try again.');
      if (r >= pass) onDone && onDone(r);
      else wrap.append(h('button', { class: 'btn sec', onclick: build }, '🔁 Try again'));
    }
  }
  build();
  return wrap;
}

function Match(pairs, onDone, opts = {}) {

    const b = h('button', { class: 'mi' }, p[0]);
    b.onclick = () => { if (b.classList.contains('done')) return; [...L.children].forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = i; fb.textContent = 'Now choose the matching ' + (opts.rightName || 'definition') + ' →'; fb.className = 'fb'; };
    L.append(b);
  });
  shuffle(pairs.map((p, i) => i)).forEach(i => {
    const b = h('button', { class: 'mi' }, pairs[i][1]);
    b.onclick = () => {

        lb.prepend(h('span', { 'aria-hidden': 'true' }, '✓ ')); b.prepend(h('span', { 'aria-hidden': 'true' }, '✓ '));

        if (matched === pairs.length) onDone && onDone(pairs.length / (pairs.length + errors));

    };

  wrap.append(h('div', { class: 'match' }, L, R), fb);

function Sort(items, bins, onDone) {
  const wrap = h('div');
  const pool = h('div', { class: 'pool', 'aria-label': 'Items to sort' });
  const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  let sel = null, left = items.length, errors = 0;
  const binEls = {};
  shuffle(items).forEach(it => {
    const c = h('button', { class: 'chip', draggable: 'true' }, it.t);
    c._it = it;
    c.onclick = () => { if (c.classList.contains('ok')) return; [...pool.children].forEach(x => x.classList.remove('sel')); c.classList.add('sel'); sel = c; fb.className = 'fb'; fb.textContent = `Where does “${it.t}” belong? Choose a box below.`; };

    pool.append(c);

  const binWrap = h('div', { class: 'bins' });

    const inner = h('div', { class: 'inner' });
    const el = h('button', { class: 'bin', 'aria-label': 'Place in ' + b.label }, h('h4', {}, h('span', { 'aria-hidden': 'true' }, b.icon || '📦'), b.label), b.desc ? h('div', { class: 'muted', style: 'font-size:.85rem' }, b.desc) : null, inner);
    el.onclick = () => place(b.id);

    binEls[b.id] = inner; binWrap.append(el);

    const it = sel._it;

      sel.classList.remove('sel'); sel.classList.add('ok'); sel.draggable = false; binEls[id].append(sel); sel = null; left--;

    } else {
      errors++; const s = sel; s.classList.add('shake'); setTimeout(() => s.classList.remove('shake'), 400);
      fb.className = 'fb bad'; fb.textContent = '✗ Not that one. ' + (it.hint || 'Think about what it does.');
    }

function Order(steps, onDone, opts = {}) {
  const wrap = h('div');
  const list = h('ol', { class: 'ord' });
  const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  let order = shuffle(steps.map((_, i) => i));
  while (steps.length > 1 && order.every((v, i) => v === i)) order = shuffle(order);
  let tries = 0, dragI = null;
  function draw(marks) {
    list.innerHTML = '';
    order.forEach((si, pos) => {
      const li = h('li', { draggable: 'true', class: marks ? (marks[pos] ? 'good' : 'badpos') : '' }, h('span', {}, steps[si]),
        h('button', { class: 'mv', 'aria-label': 'Move up', onclick: () => mv(pos, -1) }, '↑'),
        h('button', { class: 'mv', 'aria-label': 'Move down', onclick: () => mv(pos, 1) }, '↓'));
      li.ondragstart = () => { dragI = pos; li.classList.add('drag'); };
      li.ondragend = () => li.classList.remove('drag');
      li.ondragover = e => e.preventDefault();
      li.ondrop = e => { e.preventDefault(); if (dragI == null) return; const [x] = order.splice(dragI, 1); order.splice(pos, 0, x); dragI = null; draw(); };
      list.append(li);
    });
  }
  function mv(p, d) { const q = p + d; if (q < 0 || q >= order.length) return; [order[p], order[q]] = [order[q], order[p]]; draw(); }
  const chk = h('button', { class: 'btn', onclick: () => {
    tries++;
    const marks = order.map((v, i) => v === i);
    draw(marks);
    const n = marks.filter(Boolean).length;
    if (n === steps.length) { fb.className = 'fb ok'; fb.textContent = '🎉 Perfect order! ' + (opts.okMsg || ''); chk.disabled = true; onDone && onDone(tries === 1 ? 1 : tries === 2 ? .8 : .6); }
    else { fb.className = 'fb bad'; fb.textContent = `${n} of ${steps.length} are in the right place (green). Move the orange ones.` + (tries >= 2 && opts.hint ? ' Hint: ' + opts.hint : ''); }
  } }, 'Check my order');
  draw();
  wrap.append(list, h('div', { class: 'row', style: 'margin-top:12px' }, chk), fb);
  return wrap;
}

function Gap(lines, onDone, opts = {}) {
  const wrap = h('div', { class: 'gap' });
  const sels = [];
  lines.forEach(line => {
    const div = h('div', { class: 'line' });
    line.split(/(\{\{.*?\}\})/).forEach(part => {
      const m = part.match(/^\{\{(.*)\}\}$/);
      if (!m) { div.append(part); return; }
      const ch = m[1].split('|'); const s = h('select', { 'aria-label': 'Choose the missing word' }, h('option', { value: '' }, '— choose —'), shuffle(ch).map(c => h('option', { value: c }, c)));
      s._ans = ch[0]; s.onchange = () => s.classList.remove('ok', 'bad'); sels.push(s); div.append(s);
    });
    wrap.append(div);
  });
  const fb = h('div', { class: 'fb', 'aria-live': 'polite' });
  let tries = 0;
  const btn = h('button', { class: 'btn', onclick: () => {
    tries++; let n = 0;
    sels.forEach(s => { const ok = s.value === s._ans; s.classList.toggle('ok', ok); s.classList.toggle('bad', !ok); if (ok) n++; });
    if (n === sels.length) { fb.className = 'fb ok'; fb.textContent = '🎉 All correct!'; btn.disabled = true; onDone && onDone(tries === 1 ? 1 : .7); }
    else { fb.className = 'fb bad'; fb.textContent = `${n} / ${sels.length} correct. Change the red ones.`; }
  } }, 'Check answers');
  wrap.append(h('div', { class: 'row', style: 'margin-top:12px' }, btn), fb);
  return wrap;
}

function Hints(list, label = '💡 Need a hint?') {

function Write(cfg, onDone) {
  onDone = once(onDone);
  const key = cfg.key;
  const wrap = h('div');
  const ta = h('textarea', { 'aria-label': cfg.label || 'Your answer', placeholder: cfg.placeholder || 'Type your answer here…' });
  ta.value = (S.notes && S.notes[key]) || '';
  const count = h('div', { class: 'muted', style: 'font-size:.85rem;margin-top:4px' });
  const words = () => ta.value.trim().split(/\s+/).filter(Boolean).length;
  const upd = () => { count.textContent = `${words()} words (aim for at least ${cfg.minWords || 20})`; S.notes[key] = ta.value; save(); check(); };
  ta.oninput = upd;
  if (cfg.prompt) wrap.append(h('div', { class: 'callout' }, cfg.prompt));
  if (cfg.starters) {
    wrap.append(h('div', { class: 'muted', style: 'font-weight:700;margin:8px 0 6px' }, '🪜 Sentence starters (click to add):'),
      h('div', { class: 'row', style: 'gap:6px' }, cfg.starters.map(s => h('button', { class: 'chip', onclick: () => { ta.value += (ta.value && !ta.value.endsWith('\n') ? '\n' : '') + s + ' '; ta.focus(); upd(); } }, s))));
  }
  if (cfg.bank) wrap.append(h('div', { class: 'callout tip' }, h('b', {}, 'Key words to use: '), cfg.bank.join(' · ')));
  const checks = h('div', { class: 'checks' }, h('div', { style: 'font-weight:800' }, '✅ Success criteria — tick each one when your answer does it:'));
  const boxes = (cfg.checklist || []).map(c => { const i = h('input', { type: 'checkbox', onchange: () => check() }); checks.append(h('label', {}, i, c)); return i; });
  const btn = h('button', { class: 'btn', disabled: true }, cfg.submitText || 'Submit my answer');
  const modelBox = h('div');
  function check() { btn.disabled = !(words() >= (cfg.minWords || 20) && boxes.every(b => b.checked)); }
  btn.onclick = () => {
    if (cfg.model) modelBox.replaceChildren(h('div', { class: 'callout ok' }, h('b', {}, '🔍 Compare with a model answer: '), h('div', { html: cfg.model }), h('p', { class: 'muted', style: 'margin-top:8px' }, 'What did you include that the model did not? What could you add to improve yours?')));
    onDone && onDone(1);

  wrap.append(ta, count, checks, h('div', { class: 'row' }, btn), modelBox);
  upd();
  return wrap;
}

function Model(title, steps, onDone) {
  const box = h('div', { class: 'model' });
  let i = 0;
  const dots = h('div', { class: 'dots', 'aria-hidden': 'true' }, steps.map(() => h('i')));
  const body = h('div', { class: 'mb' });

  const next = h('button', { class: 'btn small' }, 'Next step →');

  go(0);

const fcGet = (k, d) => { try { const v = S.notes['fc:' + k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const fcSet = (k, v) => { S.notes['fc:' + k] = JSON.stringify(v); save(); };

function blocksSVG(code, scale = 0.68) {
  const host = el('div', { class: 'sb-wrap' });

    try {
      if (!window.scratchblocks) throw 0;
      const doc = scratchblocks.parse(code, { languages: ['en'] });
      const svg = scratchblocks.render(doc, { style: 'scratch3', scale });
      svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Scratch blocks: ' + code.replace(/\n/g, '; '));

  };

  return host;
}
function shot(name, alt) { return `<img class="shot" loading="lazy" src="${M(name)}" alt="${alt || 'Screenshot of the Scratch editor'}" width="1436" height="840">`; }
document.addEventListener('click', e => { const s = e.target.closest && e.target.closest('.shot'); if (!s) return; const lb = el('div', { class: 'lightbox', role: 'dialog', 'aria-label': 'Enlarged screenshot' }); const img = el('img', { src: s.src, alt: s.alt }); const b = el('button', { class: 'btn', type: 'button' }, '✕ Close'); lb.append(img, b); const close = () => lb.remove(); b.onclick = close; lb.onclick = ev => { if (ev.target === lb) close(); }; document.body.append(lb); b.focus(); });

const IMG = {};
['cat1', 'cat2', 'apple', 'bananas'].forEach(n => { IMG[n] = new Image(); IMG[n].crossOrigin = 'anonymous'; IMG[n].src = M(n + '.png'); });
IMG.sky = new Image(); IMG.sky.crossOrigin = 'anonymous'; IMG.sky.src = M('bluesky.jpg');
const SIZE = { cat1: 0.416, cat2: 0.416, apple: 0.25, bananas: 0.24 };
const FALLBACK = { cat1: '🐱', cat2: '🐱', apple: '🍎', bananas: '🍌' };
let actx = null;
function blip(freq = 520, dur = 0.12, type = 'square') {

    const o = actx.createOscillator(), g = actx.createGain();

    g.gain.setValueAtTime(0.06, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);

}

function drawSprite(ctx, name, x, y, flip) {

  const w = im.naturalWidth * SIZE[name], hh = im.naturalHeight * SIZE[name];
  ctx.save(); ctx.translate(sx(x), sy(y)); if (flip) ctx.scale(-1, 1); ctx.drawImage(im, -w / 2, -hh / 2, w, hh); ctx.restore();
}
function spriteBox(name, x, y, inset = 0.72) { const im = IMG[name]; const w = ((im && im.naturalWidth) || (name.startsWith('cat') ? 190 : 150)) * SIZE[name] * inset, hh = ((im && im.naturalHeight) || (name.startsWith('cat') ? 200 : 150)) * SIZE[name] * inset; return { l: x - w / 2, r: x + w / 2, b: y - hh / 2, t: y + hh / 2 }; }

  ctx.beginPath(); const tx = bx < sx(x) ? bx + w - 26 : bx + 18; ctx.moveTo(tx, by + hh - 1); ctx.lineTo(tx + 8, by + hh + 12); ctx.lineTo(tx + 14, by + hh - 1); ctx.fill();

"use strict";

const Lesson = {

    }
  }
};

/* -------- routing -------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (p[0] === 'ko') return renderKO();
  if (p[0] === 'labs') return renderLabs(p[1]);
  if (p[0] === 'boss') return renderBoss();
  const idx = LESSONS.findIndex(L => L.id === p[0]);
  if (idx >= 0 && unlocked(idx)) return renderLesson(LESSONS[idx], Math.max(0, Math.min(+p[1] || 0, LESSONS[idx].stages.length - 1)));
  renderHome();
}
window.addEventListener('hashchange', route);

/* -------- home -------- */
function nextStep() {
  for (let i = 0; i < LESSONS.length; i++) { const L = LESSONS[i]; if (!unlocked(i)) break; const s = L.stages.findIndex((_, k) => !stageDone(L, k)); if (s >= 0) return `#/${L.id}/${s}`; }
  return bossUnlocked() ? '#/boss' : '#/L1/0';
}
function renderHome() {
  Lesson.L = null;
  const done = LESSONS.filter(lessonDone).length, n = LESSONS.length;
  const badges = LESSONS.filter(L => S.done[L.id + '.badge']).length + (S.done.boss ? 1 : 0);
  app.style.removeProperty('--lc');
  app.replaceChildren(
    h('section', { class: 'hero' },
      h('div', {}, h('div', { class: 'tag', style: 'margin-bottom:12px' }, UNIT.tag), h('h1', {}, UNIT.title),
        P(UNIT.intro),

      h('div', {}, h('div', { class: 'statrow' }, h('div', { class: 'stat' }, h('b', {}, S.xp), h('span', {}, 'XP earned')), h('div', { class: 'stat' }, h('b', {}, `${done}/${n}`), h('span', {}, 'Levels complete')), h('div', { class: 'stat' }, h('b', {}, `${badges}/${n + 1}`), h('span', {}, 'Badges'))),
        h('div', { class: 'layers', 'aria-label': 'What you will learn' }, UNIT.layers.map(([t, sm, c]) => h('div', { style: `background:${c}` }, t, h('small', {}, sm)))))),

      h('div', { class: 'row', style: 'gap:6px' }, Object.values(STYPE).map(([i, t], k, a) => [h('span', { class: 'tag' }, i, ' ', t), k < a.length - 1 ? h('span', { 'aria-hidden': 'true', class: 'muted' }, '→') : null])))),

      }),

        h('span', { class: 'num' }, 'Final level'), h('span', { class: 'ico', 'aria-hidden': 'true' }, UNIT.boss.icon), h('h3', {}, UNIT.boss.name), h('span', { class: 'q' }, UNIT.boss.desc))),
    h('h2', { style: 'margin-top:48px' }, '🏅 Badges'),
    h('div', { class: 'badges' }, LESSONS.map(L => h('div', { class: 'badge' + (S.done[L.id + '.badge'] ? ' got' : '') }, h('div', { class: 'b' }, L.badge), L.title)), h('div', { class: 'badge' + (S.done.boss ? ' got' : '') }, h('div', { class: 'b' }, '🏆'), UNIT.master)),
    h('details', { class: 'card', style: 'margin-top:48px' }, h('summary', { style: 'font-weight:800;cursor:pointer' }, '🧑‍🏫 Teacher tools'),
      h('div', { class: 'stack', style: 'margin-top:16px' },
        h('label', { class: 'row', style: 'font-weight:600' }, h('input', { type: 'checkbox', checked: S.unlockAll, style: 'width:20px;height:20px', onchange: e => { S.unlockAll = e.target.checked; save(); renderHome(); } }), 'Unlock every level (for teaching out of order or revision)'),
        P('Progress and written answers are saved in this browser only. On shared computers, pupils should finish a level in one sitting. The 🧪 Labs page has every simulation in one place for demonstrating on the board.'),

}

/* -------- lesson -------- */
let chrome = {};
function drawChrome() {
  const L = Lesson.L; if (!L || !chrome.steps) return;
  chrome.objs.replaceChildren(...L.objectives.map((o, k) => h('div', { class: 'obj' + (objMet(L, k) ? ' met' : '') }, h('span', { class: 'tk', 'aria-hidden': 'true' }, objMet(L, k) ? '✓' : k + 1), h('span', {}, o, objMet(L, k) ? h('span', { class: 'sr' }, ' (achieved)') : ''))));
  chrome.steps.replaceChildren(...L.stages.map((s, i) => h('button', { class: 'st' + (i === Lesson.i ? ' cur' : '') + (stageDone(L, i) ? ' done' : ''), 'aria-current': i === Lesson.i ? 'step' : null, onclick: () => go(`#/${L.id}/${i}`) },
    h('span', { class: 'd', 'aria-hidden': 'true' }, stageDone(L, i) ? '✓' : STYPE[s.type][0]), h('span', {}, h('small', {}, `${i + 1}. ${STYPE[s.type][1]}`), s.title))));

}
function renderLesson(L, i) {

  const nextLabel = `Next: ${i < L.stages.length - 1 ? STYPE[L.stages[i + 1].type][1] : ''} →`;
  let nextAction = () => go(`#/${L.id}/${i + 1}`);
  const nextBtn = i < L.stages.length - 1 ? h('button', { class: 'btn', onclick: () => nextAction() }, nextLabel) : null;
  const skipBtn = h('button', { class: 'btn ghost small', hidden: true, onclick: () => go(`#/${L.id}/${i + 1}`) }, 'Skip to Exit ticket');

  chrome = { objs, steps, pct };
  const done = once(r => { if (st.xp) award(sKey(L, i), Math.round(st.xp * Math.max(.5, r ?? 1)), STYPE[st.type][1]); Lesson.markStage(); });

      i > 0 ? h('button', { class: 'btn sec', onclick: () => go(`#/${L.id}/${i - 1}`) }, '← Back') : h('button', { class: 'btn sec', onclick: () => go('#/') }, '← Quest map'),
      chrome.status = h('span', { class: 'muted', style: 'font-size:.85rem' }),

    h('header', { class: 'lhead' }, h('div', { class: 'k' }, `Level ${idx + 1} of ${LESSONS.length} · ${L.icon} ${L.title}`), h('h1', {}, 'Big Question: ', L.bq),
      h('div', { class: 'bq' }, 'By the end of this level I can:'), objs,
      h('div', { class: 'minibar', style: 'margin-top:16px;background:rgba(255,255,255,.25)' }, pct)),
    h('details', { class: 'card tight', style: 'margin-bottom:16px' }, h('summary', { style: 'font-weight:800;cursor:pointer' }, '📌 Key words for this level'),
      h('div', { class: 'grid2', style: 'margin-top:8px' }, L.keywords.map(([i2, w, d]) => h('div', { class: 'kwrow' }, h('span', { class: 'ic', 'aria-hidden': 'true' }, i2), h('div', {}, h('b', {}, w), h('div', { class: 'muted' }, d)))))),

}

/* -------- knowledge organiser: UNIT.ko() returns the body -------- */

    ...UNIT.ko());
}

    h('div', { class: 'card' }, BossBattle(BOSS, () => { if (award('boss', 150, UNIT.boss.award)) { S.done.boss = true; save(); confetti(); } certificate(); }), cert,
      h('div', { class: 'stage-f' }, h('button', { class: 'btn sec', onclick: () => go('#/') }, '← Quest map'))));
